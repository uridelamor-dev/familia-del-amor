<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>Familia del Amor · Panel</title>
<style>
*,*::before,*::after{box-sizing:border-box}html,body{margin:0;padding:0}
:root{
  --bg:#F1EEE4;--bg2:#EAE6D9;--surface:#FBFAF6;--surface2:#F3F0E8;--surface3:#ECE7DA;
  --border:#E4DFD1;--border2:#D3CDBB;--ink:#1B1F19;--ink2:#565B4E;--ink3:#878B79;
  --brand:#2F6B4F;--brand2:#245A41;--brand-ink:#F5FAF6;--brand-soft:#E4EFE7;
  --success:#2E9E6B;--success-soft:#E1F1E8;--warning:#B9822B;--warning-soft:#F5EBD8;
  --danger:#C24638;--danger-soft:#F6E2DE;--info:#3F6E93;--info-soft:#E1EAF1;--focus:#2F6B4F;
  --sh-sm:0 1px 2px rgba(28,38,26,.06),0 1px 3px rgba(28,38,26,.05);
  --sh-md:0 2px 6px rgba(28,38,26,.06),0 8px 22px rgba(28,38,26,.08);
  --sh-lg:0 12px 40px rgba(28,38,26,.16),0 3px 10px rgba(28,38,26,.08);
  --r-sm:8px;--r-md:14px;--r-lg:20px;--sb:248px;
  /* `--cat` se fija POR ELEMENTO (cada barra o píldora dice de qué categoría es); aquí solo
     está su valor por defecto, para que nada dependa de una variable sin declarar. */
  --cat:var(--brand);
  /* Colores de categoría de gasto. Van aquí y no en el JS porque cambian con el tema: un
     hexadecimal escrito en el código se ve mal en uno de los dos. Ver COLOR_CATEGORIA en
     src/modules/facturas/categorias.js. */
  --cat-uva:#7B4B8A;--cat-carne:#B4453C;--cat-curado:#A65A2E;--cat-mar:#2F7E9E;
  --cat-huerta:#4E8C3F;--cat-pan:#B8862F;--cat-hielo:#5B8FB0;--cat-despensa:#8A7A2E;
  --cat-limpieza:#3E8F84;--cat-envase:#6B7A8F;--cat-menaje:#7A6A55;--cat-marketing:#9B5178;
  --cat-gris:#8B8F80;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace;color-scheme:light}
:root[data-theme="dark"]{
  --bg:#0F110C;--bg2:#0B0D09;--surface:#171A13;--surface2:#1E2219;--surface3:#242A1E;
  --border:#2A2F23;--border2:#3B4230;--ink:#ECEADF;--ink2:#AEB2A2;--ink3:#787C6D;
  --brand:#6BBE92;--brand2:#57A87D;--brand-ink:#0E1610;--brand-soft:#17281E;
  --success:#4FBE88;--success-soft:#132A1E;--warning:#D8A64A;--warning-soft:#2C2413;
  --danger:#E0685A;--danger-soft:#2E1613;--info:#79A4CB;--info-soft:#12212E;--focus:#6BBE92;
  --cat-uva:#B98ECB;--cat-carne:#E58B82;--cat-curado:#DC9A66;--cat-mar:#6FB9D8;
  --cat-huerta:#8CC97C;--cat-pan:#E0BB6A;--cat-hielo:#93C2DD;--cat-despensa:#C6B662;
  --cat-limpieza:#71C7BB;--cat-envase:#A3B2C6;--cat-menaje:#B6A48A;--cat-marketing:#D68CB0;
  --cat-gris:#9AA08D;
  --sh-sm:0 1px 2px rgba(0,0,0,.4);--sh-md:0 2px 8px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --sh-lg:0 14px 44px rgba(0,0,0,.6);color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F110C;--bg2:#0B0D09;--surface:#171A13;--surface2:#1E2219;--surface3:#242A1E;
  --border:#2A2F23;--border2:#3B4230;--ink:#ECEADF;--ink2:#AEB2A2;--ink3:#787C6D;
  --brand:#6BBE92;--brand2:#57A87D;--brand-ink:#0E1610;--brand-soft:#17281E;
  --success:#4FBE88;--success-soft:#132A1E;--warning:#D8A64A;--warning-soft:#2C2413;
  --danger:#E0685A;--danger-soft:#2E1613;--info:#79A4CB;--info-soft:#12212E;--focus:#6BBE92;
  --cat-uva:#B98ECB;--cat-carne:#E58B82;--cat-curado:#DC9A66;--cat-mar:#6FB9D8;
  --cat-huerta:#8CC97C;--cat-pan:#E0BB6A;--cat-hielo:#93C2DD;--cat-despensa:#C6B662;
  --cat-limpieza:#71C7BB;--cat-envase:#A3B2C6;--cat-menaje:#B6A48A;--cat-marketing:#D68CB0;
  --cat-gris:#9AA08D;
  --sh-sm:0 1px 2px rgba(0,0,0,.4);--sh-md:0 2px 8px rgba(0,0,0,.4);--sh-lg:0 14px 44px rgba(0,0,0,.6);color-scheme:dark}}
body{font-family:var(--font);font-size:14px;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;line-height:1.5;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
::selection{background:color-mix(in srgb,var(--brand) 26%,transparent)}
.tnum{font-variant-numeric:tabular-nums}.solosm{display:none}.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.mut{color:var(--ink3)}.hl{color:var(--brand);font-weight:650}
.app{display:grid;grid-template-columns:var(--sb) 1fr;height:100vh}.app.collapsed{--sb:74px}
.sidebar{background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0;transition:width .18s}
.brand{display:flex;align-items:center;gap:11px;padding:16px 16px 12px;min-height:60px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(150deg,var(--brand),var(--brand2));display:grid;place-items:center;color:var(--brand-ink);font-weight:700;flex:none;box-shadow:var(--sh-sm)}
.brand .bt{display:flex;flex-direction:column;min-width:0;overflow:hidden}.brand .bt b{font-size:14px;letter-spacing:-.01em;white-space:nowrap}.brand .bt span{font-size:11px;color:var(--ink3);white-space:nowrap}
.app.collapsed .bt,.app.collapsed .ngt,.app.collapsed .navi span,.app.collapsed .sbf .txt{display:none}
.app.collapsed .navi .ico{display:grid}
.nav{flex:1;overflow-y:auto;padding:6px 10px 14px}.nav::-webkit-scrollbar{width:8px}.nav::-webkit-scrollbar-thumb{background:var(--border2);border-radius:8px}
/* Cada departamento se pliega. Dirección ve 18 módulos en seis bloques: plegados se ve la
   estructura de un vistazo y se abre el que toca. El grupo de la pantalla actual va siempre
   abierto (lo decide el JS), y en modo icono se abren todos porque no hay rótulos que pulsar. */
.ngt{display:flex;align-items:center;gap:6px;width:100%;font-size:10.5px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink3);padding:13px 10px 6px;cursor:pointer;background:none;border:0;
  text-align:left;border-radius:8px;transition:color .12s}
.ngt:hover{color:var(--ink2)}
.ngt .gcar{display:grid;place-items:center;color:var(--ink3);transform:rotate(-90deg);transition:transform .16s}
.ngrp.on .ngt .gcar{transform:rotate(0deg)}
.ngt .gtxt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
/* Cuántos módulos hay escondidos: sin esto, un bloque plegado no dice si oculta uno o cinco. */
.ngt .gn{font-size:10px;font-weight:600;color:var(--ink3);opacity:.75;letter-spacing:0}
.ngt .gdot{width:6px;height:6px;border-radius:50%;background:var(--danger);flex:none}
/* Plegar oculta: `display:none` y no una altura animada, porque con seis bloques y alturas
   distintas cualquier animación de altura se ve dar saltos al abrir dos seguidos. */
.ngrp .nitems{display:none}
.ngrp.on .nitems{display:block;animation:navin .16s ease}
@keyframes navin{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.app.collapsed .ngrp .nitems{display:block}
.navi{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:10px;color:var(--ink2);font-weight:500;font-size:13.5px;position:relative;transition:.12s;white-space:nowrap;width:100%;text-align:left}
.navi:hover{background:var(--surface2);color:var(--ink)}.navi.active{background:var(--surface);color:var(--ink);box-shadow:var(--sh-sm)}
.navi.active::before{content:"";position:absolute;left:-10px;top:50%;transform:translateY(-50%);width:3px;height:18px;border-radius:3px;background:var(--brand)}
.navi .ico{flex:none;color:var(--ink3);display:grid;place-items:center}.navi.active .ico,.navi:hover .ico{color:var(--brand)}
.navi .badge{margin-left:auto;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--danger-soft);color:var(--danger);min-width:0}
.app.collapsed .navi{justify-content:center;padding:9px}.app.collapsed .navi .badge{position:absolute;top:1px;right:3px;width:8px;height:8px;padding:0;overflow:hidden;color:transparent}
.sbf{border-top:1px solid var(--border);padding:10px}.sbf .u{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px}.sbf .u:hover{background:var(--surface2)}
.sbf .txt{display:flex;flex-direction:column;min-width:0}.sbf b{font-size:13px}.sbf span{font-size:11px;color:var(--ink3)}
.sbf .ext{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;color:var(--ink3);font-size:12.5px}.sbf .ext:hover{background:var(--surface2);color:var(--ink)}
.main{display:flex;flex-direction:column;min-width:0;height:100vh}
.topbar{height:60px;flex:none;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(8px);z-index:20}
.iconbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink2);transition:.12s}.iconbtn:hover{background:var(--surface2);color:var(--ink)}
.sbtn{display:flex;align-items:center;gap:10px;height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--ink3);min-width:210px;transition:.12s}.sbtn:hover{border-color:var(--border2);color:var(--ink2)}
.sbtn .kbd{margin-left:auto;font-family:var(--mono);font-size:11px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:1px 6px}
.pick{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:11px;border:1px solid var(--border);background:var(--surface);font-weight:600;font-size:13px;transition:.12s;max-width:230px;min-width:0}.pick:hover{border-color:var(--border2);box-shadow:var(--sh-sm)}
.pick .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pick .dot{width:8px;height:8px;border-radius:999px;background:var(--brand);flex:none}.pick .car{color:var(--ink3);flex:none}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:3px}.seg button{height:30px;padding:0 12px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink2)}.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-sm)}
.spacer{flex:1}.avatar{width:34px;height:34px;border-radius:999px;background:linear-gradient(140deg,var(--brand),var(--brand2));color:var(--brand-ink);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.bell{position:relative}.bell .n{position:absolute;top:2px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg)}
.gstat{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink2);padding:0 6px}
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:24px 26px 64px;scroll-behavior:smooth}.content::-webkit-scrollbar{width:10px}.content::-webkit-scrollbar-thumb{background:var(--border2);border-radius:10px}
.wrap{max-width:1280px;margin:0 auto}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:20px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--brand);display:flex;align-items:center;gap:7px;margin-bottom:8px}.eyebrow::before{content:"";width:14px;height:2px;border-radius:2px;background:var(--brand)}
.ph h1{margin:0;font-size:25px;letter-spacing:-.02em;text-wrap:balance;font-weight:680}.ph .sub{color:var(--ink2);margin-top:6px;font-size:14px;max-width:64ch}
.ph .acts{display:flex;gap:9px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 15px;border-radius:11px;font-weight:600;font-size:13px;border:1px solid var(--border);background:var(--surface);color:var(--ink);transition:.13s;white-space:nowrap}
.btn:hover{border-color:var(--border2);background:var(--surface2)}
.btn.sm{height:30px;padding:0 11px;font-size:12px;border-radius:9px}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:transparent;box-shadow:var(--sh-sm)}.btn.primary:hover{background:var(--brand2);box-shadow:var(--sh-md)}
.btn.soft{background:var(--brand-soft);color:var(--brand);border-color:transparent}.btn.danger{background:var(--danger);color:#fff;border-color:transparent}.btn.danger:hover{filter:brightness(.94)}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g12{grid-template-columns:repeat(12,1fr)}.c8{grid-column:span 8}.c4{grid-column:span 4}.c6{grid-column:span 6}.c12{grid-column:span 12}.c5{grid-column:span 5}.c7{grid-column:span 7}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--sh-sm);padding:18px}
.card.p0{padding:0;overflow:hidden}.card.lift{transition:.15s}.card.lift:hover{transform:translateY(-2px);box-shadow:var(--sh-md);border-color:var(--border2);cursor:pointer}
.card.hero{background:linear-gradient(150deg,color-mix(in srgb,var(--brand) 9%,var(--surface)),var(--surface))}
.ch{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.ch h3{margin:0;font-size:14.5px;letter-spacing:-.01em;font-weight:650}
.link{color:var(--brand);font-weight:600;font-size:12.5px;display:inline-flex;align-items:center;gap:4px;background:none}.link:hover{text-decoration:underline}
.stat{display:flex;flex-direction:column;gap:6px;position:relative}
.stat .lab{font-size:12px;color:var(--ink2);font-weight:550;display:flex;align-items:center;gap:7px}.stat .lab .ci{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.stat .val{font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.05}.stat .val small{font-size:14px;font-weight:600;color:var(--ink3)}
/* Vencido con dinero dentro no es un dato más: se ve antes de leerlo. */
.stat.alerta{border-color:color-mix(in srgb,var(--danger) 35%,var(--border))}
.stat.alerta .val,.stat.alerta .ci{color:var(--danger)}
/* Tarjetas compactas: tres cifras no necesitan la altura de un gráfico, y cada píxel de aquí
   arriba es una factura menos que se ve sin desplazar. */
.statsm .stat{padding:12px 14px}
.statsm .stat .val{font-size:23px}
.statsm .stat .sub{margin-top:1px}
/* La fila entera abre la ficha: se nota al pasar por encima. */
.facrow{cursor:pointer}
.facrow:hover{background:var(--surface2)}
/* La cabecera se queda arriba al bajar. Con 167 productos, en cuanto desplazas dejas de saber
   qué columna es cuál y hay que subir a mirar.
   OJO: `position:sticky` se agarra al ANTECESOR QUE SE DESPLAZA, y `.tw` ya se desplaza en
   horizontal — dentro de él, «top:0» no se agarra a nada. Por eso las listas largas llevan
   `.tw.alta`, que le da su propia altura: entonces sí hay un desplazamiento vertical al que
   agarrarse, y de paso las cifras de arriba no se van de la pantalla al bajar. */
.tw.alta{max-height:calc(100vh - 300px);min-height:340px;overflow:auto}
.tbl thead th{position:sticky;top:0;z-index:3;background:var(--surface)}
.tbl thead th:first-child{z-index:4}
/* Banda de mes en las listas largas: recorrer 300 facturas leyendo fechas una a una no es
   recorrer, es buscar. */
.tbl tr.sepmes td{position:sticky;top:34px;z-index:2;background:var(--surface2);color:var(--ink3);
  font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 14px}

/* Productos: el nombre es un enlace, pero pintarlo del color de marca hacía que la tabla
   entera se leyera como una lista de errores. Tinta normal y subrayado al pasar por encima. */
.linkbtn.prod{color:var(--ink);font-weight:600;text-align:left;display:block;max-width:38ch;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkbtn.prod:hover{color:var(--brand);text-decoration:underline;text-underline-offset:2px}
/* La barra de proporción va DETRÁS del número, pegada al borde inferior de la celda. */
.gastocel{position:relative;padding-bottom:5px}
.gastobar{position:absolute;right:0;bottom:0;height:3px;border-radius:3px;background:color-mix(in srgb,var(--brand) 45%,transparent);display:block}

/* ── Ficha de factura: el papel a un lado y los datos al otro ────────────────
   Una ficha existe para comparar lo leído con la factura de verdad; antes había que salir a
   Drive en otra pestaña y volver. */
.ficha{display:grid;grid-template-columns:minmax(200px,300px) 1fr;gap:20px;align-items:start}
.fic-doc{display:flex;flex-direction:column;gap:8px;position:sticky;top:0}
.fic-ph,.fic-img{width:100%;border-radius:10px;border:1px solid var(--border);background:var(--surface2);display:block}
.fic-ph{aspect-ratio:3/4;display:grid;place-items:center}
.fic-img{object-fit:contain;max-height:60vh}
.fic-ph.nofoto{border-style:dashed}
.fic-cab{display:flex;align-items:flex-start;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.fic-cab h3{font-size:16px;letter-spacing:-.02em}
.fic-pills{display:flex;gap:5px;flex-wrap:wrap}
/* Los tres bloques —quién, documento, dinero— separados por aire, no por marcos: con doce
   casillas iguales el NIF pesaba lo mismo que el total. */
.fic-g{margin-bottom:14px}
.fic-gt{display:block;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin-bottom:7px}
.fic-g .form-grid{margin-bottom:9px}
.fic-suma{margin-top:8px;font-size:12.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fic-suma .ok{color:var(--success)}
.fic-suma .mal{color:var(--danger)}
.fic-pie{display:flex;align-items:center;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border);flex-wrap:wrap}
/* Eliminar deja de ser un botón rojo al lado de Guardar: es lo que no se quiere pulsar sin
   querer, así que se va al otro extremo y pierde el peso de botón. */
.fic-pie .linkbtn.danger{color:var(--danger);font-size:12.5px}
.tbl tr.dudosa td{background:color-mix(in srgb,var(--warning) 7%,transparent)}
/* Los números del detalle se pueden corregir ahí mismo: parecen texto hasta que los tocas. */
.lincel{width:88px;max-width:88px;text-align:right;font-variant-numeric:tabular-nums;
  border:1px solid transparent;background:transparent;border-radius:7px;padding:3px 6px;font-size:13px;color:inherit}
.lincel:hover{border-color:var(--border2)}
.lincel:focus{border-color:var(--brand);background:var(--surface);outline:none}

/* La línea del precio. En móvil se va: el ancho que ocupa vale más para el nombre, y el dato
   sigue estando en la columna de al lado y en el histórico del producto. */
.spark{display:block;overflow:visible}
.tbl td.sparkcel,.tbl th.sparkcel{width:86px;padding-left:6px;padding-right:6px}
/* El proveedor y la categoría, en columna: se recorren de arriba abajo. Se recortan porque un
   nombre largo de proveedor no puede empujar al producto fuera de la pantalla. */
.tbl td.provcol,.tbl th.provcol{max-width:190px}
/* `.linkbtn` se declara más abajo y pinta de rojo: a igual especificidad gana la última, así
   que aquí hace falta `.linkbtn.provlink`. Una columna entera de nombres en rojo se lee como
   una lista de errores — el mismo fallo que ya tuvimos con los nombres de producto. */
.linkbtn.provlink{max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  display:inline-block;vertical-align:bottom;color:var(--ink2);font-weight:500}
.linkbtn.provlink:hover{color:var(--brand);text-decoration:underline;text-underline-offset:2px}
/* Los módulos de un usuario, plegados: doce píldoras hacen tres líneas por fila. */
.modsfold>summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.modsfold>summary::-webkit-details-marker{display:none}
.tbl td.catcol,.tbl th.catcol{white-space:nowrap}
/* Con la ventana estrecha se van antes que el dinero, que es lo que se viene a ver. */
@media (max-width:1180px){.tbl td.catcol,.tbl th.catcol{display:none}}
@media (max-width:1040px){.tbl td.provcol,.tbl th.provcol{display:none}}

.stat .sub{font-size:12px;color:var(--ink3)}
.delta{font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}.up{color:var(--success)}.down{color:var(--danger)}.flat{color:var(--ink3)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--ink2);border:1px solid var(--border)}
.pill.ok{background:var(--success-soft);color:var(--success);border-color:transparent}.pill.warn{background:var(--warning-soft);color:var(--warning);border-color:transparent}
.pill.bad{background:var(--danger-soft);color:var(--danger);border-color:transparent}
/* `imp` (importante) lo genera el JS en incidencias y candidaturas; sin esta regla salía gris. */
.pill.imp{background:var(--warning-soft);color:var(--warning);border-color:transparent}.pill.info{background:var(--info-soft);color:var(--info);border-color:transparent}.pill.brand{background:var(--brand-soft);color:var(--brand);border-color:transparent}
.chip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;font-weight:550;color:var(--ink2);transition:.12s}.chip:hover{border-color:var(--border2);color:var(--ink)}.chip.on{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
/* ── Cuadrante de horarios ─────────────────────────────────────────────────
   Rejilla tramo × área × 7 días, la misma estructura que el cuadrante de papel.
   Clases propias con prefijo `hor`: no se toca nada de lo compartido. */
.hortramo{margin-bottom:18px}
.hortramo-t{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin:0 0 6px 2px}
.horgrid{display:grid;grid-template-columns:120px repeat(7,minmax(116px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden}
.horgrid.porpersona{grid-template-columns:150px repeat(7,minmax(96px,1fr)) 74px}
.horcell{background:var(--surface);padding:6px}
.horhead{background:var(--surface2);text-align:center;padding:8px 6px}
.horhead.hoy{background:var(--brand-soft)}
.horhead .dwd{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3)}
.horhead .dnum{font-size:15px;font-weight:650;line-height:1.2}
.horarea{background:var(--surface2);display:flex;align-items:center;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);overflow:hidden;text-overflow:ellipsis}
.horslot{min-height:56px;display:flex;flex-direction:column;gap:3px;position:relative;transition:background .12s ease}
.horslot.dropok{background:var(--brand-soft);box-shadow:inset 0 0 0 2px var(--brand)}
.horchip{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:3px 7px;font-size:12px;font-weight:600;line-height:1.35;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.12s}
.horchip:hover{border-color:var(--brand);background:var(--brand-soft)}
.horchip[draggable="true"]{cursor:grab}
.horchip.dragging{opacity:.4}
.horchip .hf{color:var(--ink3);font-weight:600;margin-right:5px;font-variant-numeric:tabular-nums}
.horchip.lib{background:transparent;border-style:dashed;color:var(--ink3);font-weight:500}
/* Fila de fiesta: se calcula sola, no se toca. Va en gris y sin cursor de mano para que se
   vea de un vistazo que ahí no se arrastra ni se hace clic; lo que cambia quién libra es
   poner o quitar un turno arriba. Las ausencias (vacaciones, baja) van marcadas aparte:
   poner a alguien de baja bajo el rótulo FIESTA sin distinguirlo sería un error feo. */
.hortramo.desc .hortramo-t{color:var(--ink3)}
.horchip.desc{background:transparent;border-style:dashed;color:var(--ink2);font-weight:500;cursor:default}
.horchip.desc:hover{border-color:var(--border);background:transparent}
.horchip.desc.aus{border-style:solid;background:var(--warning-soft);border-color:transparent;color:var(--warning)}
.horchip.desc.aus .hf{color:inherit;opacity:.75}
.horslot.nodrop{min-height:44px;background:repeating-linear-gradient(135deg,transparent,transparent 7px,var(--surface2) 7px,var(--surface2) 8px)}
/* El botón de añadir solo aparece al pasar por encima: si no, la rejilla se llena de "+" */
.hormas{position:absolute;right:4px;bottom:4px;width:22px;height:22px;border-radius:7px;background:var(--surface2);color:var(--ink3);font-size:15px;line-height:1;opacity:0;transition:.12s}
.horslot:hover .hormas{opacity:1}
.hormas:hover{background:var(--brand);color:var(--brand-ink)}
.hortot{display:flex;align-items:center;justify-content:flex-end;background:var(--surface2);font-variant-numeric:tabular-nums}
.hortot.alto b{color:var(--danger)}
/* ── El cuadrante en móvil: lista de días, no rejilla ──────────────────────
   Siete columnas en 390 px son dos días y medio visibles y desplazarse a ciegas, y el
   cuadrante existe justamente para ver la semana de un vistazo. Se pintan las dos y el
   CSS elige: así no hay dos verdades ni hay que repintar al girar el móvil. */
.hordias{display:none}
@media(max-width:900px){.horgrid{grid-template-columns:96px repeat(7,minmax(104px,1fr));overflow-x:auto}}
@media(max-width:720px){
  .hortramo{display:none}
  .hordias{display:block;list-style:none;margin:0;padding:0}
  .hordias li{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .hordias li.es-hoy{box-shadow:inset 3px 0 0 var(--brand);border-color:var(--brand)}
  .hord-dia{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);font-weight:700;margin-bottom:8px}
  .hord-dia b{color:var(--ink);font-size:15px;margin-left:2px}
  .hord-tramo{margin-bottom:10px}
  .hord-tramo:last-child{margin-bottom:0}
  .hord-th{font-size:11.5px;font-weight:700;color:var(--ink2);margin-bottom:5px}
  .hord-area{display:flex;gap:8px;align-items:flex-start;margin-bottom:5px}
  .hord-et{flex:0 0 62px;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink3);font-weight:600;padding-top:5px}
  .hord-gente{display:flex;flex-wrap:wrap;gap:5px;flex:1}
  .hord-gente .horchip{min-height:32px;display:inline-flex;align-items:center}
}

/* ── Fichajes ──────────────────────────────────────────────────────────────
   Solo el semáforo de «quién está dentro» y una etiqueta de estado. Todo lo demás
   reutiliza .card/.tbl/.btn. La pantalla del kiosco tiene su propio public/fichar.css. */
.fic-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink3);vertical-align:middle;margin-right:2px}
.fic-dot.dentro{background:var(--success)}
.fic-dot.pausa{background:var(--warning)}
.fic-tag{display:inline-block;padding:2px 8px;border-radius:999px;border:1px solid var(--border);background:var(--surface2);font-size:11px;font-weight:600;color:var(--ink3);white-space:nowrap;margin-right:4px}
.fic-tag.ok{border-color:transparent;background:var(--brand-soft);color:var(--brand)}
.fic-tag.aviso{border-color:transparent;background:var(--danger-soft);color:var(--danger)}
.fic-evs{list-style:none;margin:0;padding:0}
.fic-evs li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.fic-evs li:last-child{border-bottom:none}
/* Anulado NO se oculta: la fila sigue ahí, tachada, porque el registro no se borra. */
.fic-evs li.anulado>span:first-child{text-decoration:line-through;color:var(--ink3)}
.fic-nota{margin:0 0 14px;padding:10px 12px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);font-size:12.5px;line-height:1.5;color:var(--ink2)}

/* Rejilla de «cuánta gente hace falta»: dos números apilados por celda (mínimo arriba,
   objetivo abajo). Apilados y no en fila porque así cada fila se lee de un tirón: todos
   los mínimos de la semana seguidos, y debajo todos los objetivos. */
.horcfg-nec td.horcfg-celda{text-align:center;padding:3px}
.horcfg-nec .horcfg-n{width:42px;text-align:center;padding:4px 2px;font-variant-numeric:tabular-nums;display:block;margin:0 auto}
.horcfg-nec .es-obj{margin-top:3px;color:var(--ink3);background:var(--surface2)}
.horcfg-nec th{text-align:center}
.horcfg-nec th:first-child{text-align:left}

/* Disponibilidad: botón de tres estados. Un <select> nativo se come 60 px por celda y con
   siete días la tabla no cabe en el diálogo. */
.horcfg-d{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);
  font-size:13px;line-height:1;cursor:pointer;transition:.12s;color:var(--ink3)}
.horcfg-d:hover{border-color:var(--brand)}
.horcfg-d.pref-prefiere{background:var(--brand-soft);border-color:transparent;color:var(--brand)}
.horcfg-d.pref-no_disponible{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.horcfg-ley{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;vertical-align:middle;
  background:var(--surface2);color:var(--ink3);font-size:11px}
.horcfg-ley.pref-prefiere{background:var(--brand-soft);color:var(--brand)}
.horcfg-ley.pref-no_disponible{background:var(--danger-soft);color:var(--danger)}

/* Refuerzos: una ficha por refuerzo, no una fila de tabla. Entre la etiqueta, la duración,
   dos horas y siete días no cabe todo a lo ancho del diálogo. */
.horcfg-ref{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:var(--surface)}
.horcfg-ref-h{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12.5px}
.horcfg-ref-h .horcfg-r[data-k="etiqueta"]{width:150px}
.horcfg-r-num{width:48px;text-align:center}
/* Ancho generoso a propósito: en un navegador en inglés el campo de hora añade AM/PM y
   con 104 px se cortaba. */
.horcfg-r-hora{width:124px}
.horcfg-ref-d{display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap;margin-top:10px;padding-top:9px;border-top:1px dashed var(--border);font-size:12px}
.horcfg-ref-d label{display:grid;justify-items:center;gap:2px}
.horcfg-ref-d label span{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);font-weight:600}
.horcfg-ref-d .horcfg-rd{width:42px;text-align:center;padding:4px 2px;font-variant-numeric:tabular-nums}

/* Tarjeta plegable (<details>): la cabecera hace de tirador. Nativa, sin JS. */
.card.fold{padding:0;overflow:hidden;align-self:start}
.card.fold>summary{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0;padding:16px 18px;cursor:pointer;list-style:none;transition:background .12s ease}
.card.fold>summary::-webkit-details-marker{display:none}
.card.fold>summary:hover{background:var(--surface2)}
.card.fold>summary h3{margin:0;font-size:14.5px;letter-spacing:-.01em;font-weight:650}
.card.fold>summary .foldr{display:flex;align-items:center;gap:10px;color:var(--ink3);font-size:12.5px}
.card.fold>summary .car{display:flex;transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.card.fold[open]>summary{border-bottom:1px solid var(--border)}
.card.fold[open]>summary .car{transform:rotate(180deg)}
.card.fold>summary:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.rows{display:flex;flex-direction:column}.row{display:flex;align-items:center;gap:13px;padding:12px 16px;border-top:1px solid var(--border)}.row:first-child{border-top:0}.row:hover{background:var(--surface2)}
.row .grow{flex:1;min-width:0}.t1{font-weight:600;font-size:13.5px;letter-spacing:-.01em}.t2{font-size:12px;color:var(--ink3);margin-top:2px}
.ava{width:32px;height:32px;border-radius:999px;display:grid;place-items:center;font-weight:650;font-size:12px;color:var(--brand);background:var(--brand-soft);flex:none}
.att{display:flex;gap:13px;padding:14px 16px;border-top:1px solid var(--border);align-items:flex-start}.att:first-child{border-top:0}
.att .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.ic.bad{background:var(--danger-soft);color:var(--danger)}.ic.warn{background:var(--warning-soft);color:var(--warning)}.ic.info{background:var(--info-soft);color:var(--info)}.ic.ok{background:var(--success-soft);color:var(--success)}
.att .grow b{font-size:13.5px;font-weight:600}.att .grow p{margin:3px 0 0;font-size:12.5px;color:var(--ink2)}.att .grow .meta{margin-top:5px;font-size:11.5px;color:var(--ink3);display:flex;gap:10px;flex-wrap:wrap}.att.done{opacity:.5}
.prog{height:7px;border-radius:999px;background:var(--surface2);overflow:hidden}.prog>i{display:block;height:100%;border-radius:999px;background:var(--brand);transition:width .6s cubic-bezier(.2,.8,.2,1)}.prog.warn>i{background:var(--warning)}.prog.bad>i{background:var(--danger)}
/* Envoltorio de tabla ancha. Se usa en 12 sitios (facturas, fichajes, horarios…) y NO
   tenía ninguna regla: las tablas anchas se cortaban por la derecha en silencio en vez de
   poder desplazarse. `-webkit-overflow-scrolling` para que el gesto vaya bien en iPad, que
   es donde se mira el cuadrante. */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* Gráfico con el dato al pasar el ratón. La guía y el globo solo aparecen al entrar,
   para que el gráfico en reposo siga siendo lo mismo de siempre. */
.chart{position:relative}
.chart-guia{position:absolute;top:0;bottom:0;width:1px;background:var(--border2);opacity:0;transition:opacity .1s;pointer-events:none}
.chart.on .chart-guia{opacity:1}
/* El globo va DENTRO del gráfico, no encima: si sale por arriba tapa las cifras de la
   cabecera de la tarjeta, que es justo lo que se está comparando. */
.chart-tip{position:absolute;top:4px;transform:translate(-50%,0);background:var(--ink);color:var(--surface);
  border-radius:8px;padding:6px 9px;font-size:11.5px;line-height:1.45;white-space:nowrap;pointer-events:none;
  opacity:0;transition:opacity .1s;box-shadow:var(--sh-lg);z-index:5;display:grid;gap:1px}
.chart.on .chart-tip{opacity:1}
.chart-tip.izq{transform:translate(-100%,0)}
.chart-tip.der{transform:translate(0,0)}
.chart-tip b{font-size:10.5px;opacity:.7;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.chart-tip .ex{font-variant-numeric:tabular-nums;opacity:.85}

/* Plantillas de campaña: el mensaje se ve tal cual va a salir, con pinta de WhatsApp. */
.campplant:hover{background:var(--surface2)}
.campplant-msg{margin-top:7px;padding:8px 10px;border-radius:10px 10px 10px 3px;background:var(--brand-soft);
  font-size:12.5px;line-height:1.5;white-space:normal;color:var(--ink)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);font-weight:600;padding:11px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--border)}.tbl tr:last-child td{border-bottom:0}.tbl tbody tr:hover{background:var(--surface2)}.tbl th.r,.tbl td.r{text-align:right}
.tbl th:first-child,.tbl td:first-child{padding-left:18px}.tbl th:last-child,.tbl td:last-child{padding-right:18px}

.mbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--surface2)}.mbar span{height:100%}
.wrapf{display:flex;flex-wrap:wrap;gap:9px}.between{display:flex;align-items:center;justify-content:space-between;gap:12px}.flex{display:flex;align-items:center;gap:10px}
.big{font-size:40px;font-weight:750;letter-spacing:-.035em;line-height:1}
.sdot{width:9px;height:9px;border-radius:999px;flex:none}.st-exc{background:var(--success)}.st-ok{background:var(--brand)}.st-warn{background:var(--warning)}.st-crit{background:var(--danger)}.st-off{background:var(--ink3)}
.ep{fill:var(--surface);stroke:var(--brand);stroke-width:2}.barcol{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1}
.sk{background:linear-gradient(90deg,var(--surface2) 25%,color-mix(in srgb,var(--surface2) 55%,var(--surface)) 37%,var(--surface2) 63%);background-size:400% 100%;animation:sh 1.3s ease infinite;border-radius:8px}@keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}
.enter>*{opacity:0;transform:translateY(8px);animation:rise .5s cubic-bezier(.2,.8,.2,1) forwards}@keyframes rise{to{opacity:1;transform:none}}
/* Formularios / campos (panel real) */
/* Campos unificados (estética tipo Apple): mismo alto/radio/tipografía, foco suave y consistente
   en TODAS las vistas. Los select llevan chevron propio; fechas/horas con icono afinado. */
input,select,textarea{border:1px solid var(--border);background:var(--surface);border-radius:11px;padding:0 12px;font:inherit;font-size:13.5px;color:var(--ink);max-width:100%;transition:border-color .14s ease,box-shadow .14s ease,background .14s ease;-webkit-font-smoothing:inherit}
input,select{height:38px}
textarea{padding:9px 12px;font-size:13.5px;line-height:1.5;width:100%;resize:vertical}
input:hover:not(:disabled):not(:focus),select:hover:not(:disabled):not(:focus),textarea:hover:not(:disabled):not(:focus){border-color:var(--border2)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)}
input::placeholder,textarea::placeholder{color:var(--ink3)}
input:disabled,select:disabled,textarea:disabled{opacity:.55;cursor:not-allowed}
/* Select con chevron propio (mismo en todos los navegadores) */
select{-webkit-appearance:none;-moz-appearance:none;appearance:none;cursor:pointer;padding-right:34px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%238A8E7D' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 12px center;background-size:15px}
/* Casillas/opciones: nativas pero con el color de marca */
input[type=checkbox],input[type=radio]{width:auto;height:auto;accent-color:var(--brand);cursor:pointer}
/* Fechas y horas: campo consistente + icono afinado (el calendario emergente es del sistema) */
input[type=date],input[type=time],input[type=datetime-local],input[type=month]{cursor:pointer;font-variant-numeric:tabular-nums}
input::-webkit-calendar-picker-indicator{opacity:.45;cursor:pointer;transition:opacity .14s ease}
input:hover::-webkit-calendar-picker-indicator,input:focus::-webkit-calendar-picker-indicator{opacity:.85}
input[type=date]::-webkit-datetime-edit,input[type=time]::-webkit-datetime-edit,input[type=datetime-local]::-webkit-datetime-edit{color:var(--ink)}
/* ── Selector de fecha propio (dpField): mismo lenguaje que los <select>, con calendario
   emergente nuestro en vez del del sistema. El disparador es un botón; el valor vive en
   un <input type=hidden> con el mismo id, así que quien lea `.value` sigue funcionando. */
.dp{display:flex;min-width:0}
.dpt{display:flex;align-items:center;gap:8px;width:100%;height:38px;padding:0 10px 0 12px;border:1px solid var(--border);background:var(--surface);border-radius:11px;font-size:13.5px;color:var(--ink);text-align:left;font-variant-numeric:tabular-nums;transition:border-color .14s ease,box-shadow .14s ease}
.dpt:hover{border-color:var(--border2)}
.dpt.on{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)}
.dpt .dpi{display:flex;flex:none;color:var(--ink3)}
.dpt .dpl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dpt.ph .dpl{color:var(--ink3)}
.dpt .dpx{flex:none;display:grid;place-items:center;width:18px;height:18px;border-radius:999px;color:var(--ink3);font-size:11px;line-height:1;transition:.12s}
.dpt .dpx:hover{background:var(--surface3);color:var(--ink)}
.dpop{position:fixed;z-index:200;width:286px;padding:12px;background:var(--surface);border:1px solid var(--border2);border-radius:16px;box-shadow:var(--sh-lg);animation:dppop .16s cubic-bezier(.2,.8,.2,1)}
@keyframes dppop{from{opacity:0;transform:translateY(-6px) scale(.98)}}
.dpop .dph{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px}
.dpop .dpm{font-size:13.5px;font-weight:650;letter-spacing:-.01em}
.dpop .dpnav{display:flex;gap:2px}
.dpop .dpnav button{width:28px;height:28px;border-radius:9px;color:var(--ink2);display:grid;place-items:center;font-size:16px;line-height:1}
.dpop .dpnav button:hover{background:var(--surface2);color:var(--ink)}
.dpg{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.dpg .dpw{padding:5px 0;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3);text-align:center}
.dpg button{height:34px;border-radius:9px;font-size:12.5px;font-weight:550;color:var(--ink);transition:background .12s ease,color .12s ease}
.dpg button:hover:not(:disabled){background:var(--surface2)}
.dpg button.out{color:var(--ink3);opacity:.55}
.dpg button.today{color:var(--brand);font-weight:750}
.dpg button.sel,.dpg button.sel:hover{background:var(--brand);color:var(--brand-ink);font-weight:700}
.dpg button:disabled{opacity:.25;cursor:not-allowed}
.dpf{display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.dpf button{flex:1;height:30px;border-radius:9px;font-size:12px;font-weight:600;color:var(--ink2);background:var(--surface2)}
.dpf button:hover{color:var(--ink);background:var(--surface3)}

/* ── Calendario de rango (elegir periodo) ─────────────────────────────────────
   Dos meses, el rango pintado en medio y los extremos redondeados por fuera. La franja va
   sobre una celda cuadrada de fondo (.rngd::before) para que quede continua entre días. */
.rng{display:flex;gap:18px;align-items:flex-start}
.rngq{display:flex;flex-direction:column;gap:2px;flex:none;width:146px;padding-right:16px;border-right:1px solid var(--border)}
.rngq button{text-align:left;padding:7px 10px;border-radius:9px;font-size:12.5px;font-weight:550;color:var(--ink2);white-space:nowrap;transition:background .12s ease,color .12s ease}
.rngq button:hover{background:var(--surface2);color:var(--ink)}
.rngc{flex:1;min-width:0}
.rngh{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.rngnav{width:30px;height:30px;border-radius:999px;color:var(--ink2);font-size:17px;line-height:1;transition:background .12s ease}
.rngnav:hover{background:var(--surface2);color:var(--ink)}
.rngcals{display:flex;gap:22px}
.rngmes{flex:1;min-width:0}
.rngmt{text-align:center;font-size:13px;font-weight:650;letter-spacing:-.01em;margin:-24px 0 6px;pointer-events:none}
.rngg{display:grid;grid-template-columns:repeat(7,1fr)}
.rngw{padding:4px 0 6px;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3);text-align:center}
.rngd{position:relative;height:32px;font-size:12.5px;font-weight:550;color:var(--ink);font-variant-numeric:tabular-nums;display:grid;place-items:center}
.rngd.out{visibility:hidden}
.rngd::before{content:"";position:absolute;inset:1px 0;background:transparent;z-index:0}
.rngd>*,.rngd{z-index:1}
.rngd.in::before,.rngd.ini::before,.rngd.fin::before{background:color-mix(in srgb,var(--brand) 13%,transparent)}
.rngd.ini::before{border-radius:999px 0 0 999px}
.rngd.fin::before{border-radius:0 999px 999px 0}
.rngd.in.rnglft::before,.rngd.fin.rnglft::before{border-top-left-radius:999px;border-bottom-left-radius:999px}
.rngd.in.rngrgt::before,.rngd.ini.rngrgt::before{border-top-right-radius:999px;border-bottom-right-radius:999px}
.rngd.solo::before,.rngd.ini.fin::before{border-radius:999px}
.rngd.ini,.rngd.fin{color:var(--brand-ink);font-weight:700}
.rngd.ini::after,.rngd.fin::after{content:"";position:absolute;inset:1px 2px;border-radius:999px;background:var(--brand);z-index:-1}
.rngd.hoy:not(.ini):not(.fin){color:var(--brand);font-weight:750}
.rngd:not(:disabled):not(.out):hover::after{content:"";position:absolute;inset:1px 2px;border-radius:999px;background:var(--surface3);z-index:-1}
.rngd.ini:hover::after,.rngd.fin:hover::after{background:var(--brand)}
.rngd:disabled{opacity:.28;cursor:not-allowed}
.rngf{display:flex;align-items:center;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border);flex-wrap:wrap}
.rngsum{font-size:13px;font-variant-numeric:tabular-nums}
/* Región de resultados refrescándose en vivo (filtros sin botón «Buscar») */
.livebusy{opacity:.45;pointer-events:none;transition:opacity .15s ease}
/* Campos con look propio (buscador ⌘K y chat de Sara): sin el aro de foco genérico */
.cmdk input:focus,.sbar-row textarea:focus{box-shadow:none}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}.field label{font-size:11px;color:var(--ink3);font-weight:600}
.linkbtn{color:var(--danger);font-weight:600;font-size:12px;background:none}.linkbtn:hover{text-decoration:underline}
.stars{color:var(--warning);letter-spacing:1px;font-size:14px}
.badge{display:inline-block;min-width:22px;text-align:center;padding:2px 8px;border-radius:20px;font-weight:700;font-size:12px;background:var(--brand-soft);color:var(--brand)}
.badge.warn{background:var(--warning-soft);color:var(--warning)}.badge.bad{background:var(--danger-soft);color:var(--danger)}
.pendingblock{border:1px dashed var(--border2);border-radius:14px;padding:16px 18px;background:transparent;font-size:13px;line-height:1.6;color:var(--ink2);margin-top:16px}.pendingblock b{color:var(--ink)}
.revcard.neg{border-left:3px solid var(--danger)}
.revreply{margin-top:10px;padding:10px 13px;border-radius:11px;background:var(--brand-soft);font-size:13px;line-height:1.5}.revreply .k{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--brand);margin-bottom:3px}
.revsel{width:18px;height:18px;margin-top:4px;flex:none;accent-color:var(--brand)}
/* Modales de formulario (panel real) */
/* ── Panel lateral de filtros ──────────────────────────────────────────────
   Entra desde la derecha y deja ver la lista de fondo, que es lo que permite entender
   qué se está filtrando mientras se toca. Un modal centrado tapa justo eso. */
.drw-ov{position:fixed;inset:0;background:rgba(15,17,12,.30);z-index:160;opacity:0;transition:opacity .18s}
.drw-ov.on{opacity:1}
.drw{position:fixed;top:0;right:0;bottom:0;width:min(400px,92vw);background:var(--surface);
  border-left:1px solid var(--border2);box-shadow:-16px 0 40px rgba(15,17,12,.14);
  display:flex;flex-direction:column;transform:translateX(100%);transition:transform .2s ease}
/* OJO: la clase `on` la pone drawer() en el FONDO (.drw-ov), no en el panel. Con solo
   `.drw.on` el fondo se oscurecía y el panel se quedaba fuera de la pantalla, así que parecía
   que el botón de filtros no hacía nada. Se dejan las dos formas por si alguna vez se marca
   el panel directamente. */
.drw-ov.on .drw,.drw.on{transform:none}
.drw-h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border)}
.drw-h h3{margin:0;font-size:15px}
.drw-b{flex:1;overflow:auto;padding:4px 20px 20px}
.drw-f{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--border);background:var(--surface)}
.drw-f .btn{flex:1}
/* Cada bloque de filtro, separado por una línea fina: se recorre de un vistazo. */
.drw-g{padding:16px 0;border-bottom:1px solid var(--border)}
.drw-g:last-child{border-bottom:0}
.drw-g>label,.drw-gt{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:650;color:var(--ink2);margin-bottom:9px}
.drw-g .inp,.drw-g select,.drw-g input{width:100%}
.drw-row{display:flex;gap:8px}
.drw-row>*{flex:1;min-width:0}
/* Píldoras de selección múltiple. Un desplegable esconde las opciones; aquí se ven todas
   y se ve cuáles están puestas sin abrir nada. */
.drw-pills{display:flex;flex-wrap:wrap;gap:7px}
.drw-pill{height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--border);background:var(--surface2);
  font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer;transition:.12s}
.drw-pill:hover{border-color:var(--brand)}
.drw-pill.on{background:var(--brand);border-color:transparent;color:var(--brand-ink)}
/* El punto del botón «Filtrar» cuando hay algo puesto. */
.btn .fdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--brand);margin-left:7px;vertical-align:middle}
.btn.primary .fdot{background:var(--brand-ink)}
/* Resumen de lo aplicado, para no tener que abrir el panel para saber qué se está viendo. */
.fchips{display:flex;flex-wrap:wrap;gap:7px;margin:-4px 0 14px}
.fchip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 11px;border-radius:999px;
  border:1px solid var(--border);background:var(--surface);font-size:12px;color:var(--ink2)}
.fchip b{color:var(--ink);font-weight:650}
.fchip button{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--ink3);font-size:13px;line-height:1}
.fchip button:hover{background:var(--danger-soft);color:var(--danger)}

/* Subir factura: pensada para el móvil, de pie en la barra y con el albarán en una mano. El
   botón de cámara ocupa casi la pantalla a propósito — hay que poder acertar sin mirar. */
/* Establecimiento fijado por dirección: mismo aspecto que el selector pero sin flecha ni
   cursor de mano, para que no se intente pulsar algo que no se puede cambiar. */
.pick.fijo{cursor:default;opacity:.9}
.pick.fijo:hover{background:inherit;border-color:var(--border)}
/* Dos facturas lado a lado para decidir si son la misma. Se enseñan ENTERAS y con el enlace
   al papel: la decisión se toma mirando los dos documentos, no fiándose de un porcentaje. */
.dupcard{border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;background:var(--surface)}
.dupmot{margin:0 0 12px;font-size:13px;color:var(--ink2);line-height:1.5}
.dupgrid{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.dupcol{background:var(--surface2);border-radius:11px;padding:11px 13px;min-width:0}
.dupcol.nueva{box-shadow:inset 3px 0 0 var(--warning)}
.dupcol .t1{font-size:14.5px;font-weight:600;margin:2px 0 6px}
.dupdatos{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--ink2);margin-bottom:8px;font-variant-numeric:tabular-nums}
.dupdatos b{color:var(--ink);font-size:14px}
.dupvs{font-size:11.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.dupacts{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px;justify-content:flex-end}
@media (max-width:700px){
  .dupgrid{grid-template-columns:1fr}
  .dupvs{text-align:center;padding:2px 0}
  .dupacts .btn{flex:1 1 100%}
}
.subcard{max-width:420px;margin:0 auto;text-align:center}
.subbig{width:100%;display:flex;flex-direction:column;align-items:center;gap:6px;padding:30px 20px;
  border-radius:18px;border:2px dashed var(--border2);background:var(--surface);cursor:pointer;transition:.14s}
.subbig:hover,.subbig:active{border-color:var(--brand);background:var(--brand-soft)}
.subbig .subico{color:var(--brand);display:grid;place-items:center;margin-bottom:2px}
.subbig b{font-size:16.5px;color:var(--ink)}
.subbig span{font-size:12.5px;color:var(--ink3)}
.subalt{margin-top:12px;width:100%;padding:12px;border-radius:12px;border:1px solid var(--border);
  background:var(--surface);color:var(--ink2);font-size:13.5px;cursor:pointer}
.subalt:hover{border-color:var(--brand);color:var(--brand)}
/* Las dos áreas de Analítica: Ventas y Control. Botones grandes con subtítulo y no pestañas
   pequeñas, porque son dos formas distintas de mirar el negocio y no dos filtros del mismo
   informe. Ocupan una línea entera a propósito. */
.anareas{display:flex;gap:10px;margin:0 0 14px;flex-wrap:wrap}
.anarea{flex:1 1 200px;text-align:left;padding:11px 15px;border-radius:13px;border:1px solid var(--border);
  background:var(--surface);cursor:pointer;transition:.14s;min-width:0}
.anarea b{display:block;font-size:14.5px;color:var(--ink)}
.anarea span{display:block;font-size:12px;color:var(--ink3);margin-top:1px}
.anarea:hover{border-color:var(--brand)}
.anarea.on{border-color:transparent;background:var(--brand);box-shadow:var(--sh-sm)}
.anarea.on b,.anarea.on span{color:var(--surface)}
.anarea.on span{opacity:.82}
/* Cuatro cifras de cabecera dentro de un diálogo. Se envuelven a dos columnas en móvil en
   vez de encogerse: cuatro números de 60 px no se leen. */
.kpis4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpis4 .kpi{background:var(--surface2);border-radius:12px;padding:10px 12px;min-width:0}
.kpis4 .kpi span{display:block;font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.kpis4 .kpi b{font-size:19px;font-variant-numeric:tabular-nums;line-height:1.25;word-break:break-word}
@media (max-width:560px){.kpis4{grid-template-columns:repeat(2,1fr)}}
/* Subcategorías bajo su categoría en el reparto de gasto. */
.subcats{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.subcat{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--ink2);cursor:pointer;border:0}
.subcat:hover{background:var(--brand-soft);color:var(--brand)}
.subcat b{font-variant-numeric:tabular-nums}
/* Barra proporcional del reparto de gasto por categoría. Sin números al lado: los números ya
   están en la fila; la barra es solo para ver de un vistazo cuál se lleva la mitad. */
.barmini{height:5px;border-radius:3px;background:var(--surface2);margin-top:5px;overflow:hidden}
.barmini>span{display:block;height:100%;border-radius:3px;background:var(--cat, var(--brand))}
/* Punto de color delante del nombre de la categoría: es lo que deja leer «en qué se va
   el dinero» sin ir etiqueta por etiqueta. */
.catdot{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:7px;background:var(--cat, var(--brand));flex:none}
.pill.cat{background:color-mix(in srgb, var(--cat, var(--brand)) 16%, transparent);color:var(--cat, var(--brand));border-color:transparent}
[data-comp="cat"]{cursor:pointer;border-radius:9px;transition:background .12s}
[data-comp="cat"]:hover{background:var(--brand-soft)}
/* Proveedor sin categoría: se marca la fila entera, no una celda, para que se vea al pasar
   la lista de arriba abajo buscando qué falta por etiquetar. */
.tbl tr.sincat td:first-child{box-shadow:inset 3px 0 0 var(--danger)}
/* Selección de documentos */
.tbl th.facsel,.tbl td.facsel{width:34px;padding-left:14px;padding-right:0}
/* La miniatura del papel. Una factura se reconoce por su pinta antes que por su número;
   si no hay archivo o Drive no la da, la fila se queda sin foto y no pasa nada. */
.tbl th.facthumb,.tbl td.facthumb{width:46px;padding-left:8px;padding-right:0}
.thumb.ph{display:block;background:var(--surface2);border:1px solid var(--border)}
/* 38×46 mandaba la altura de la fila entera (69 px): tres facturas menos por pantalla para
   una miniatura que solo sirve para reconocer el papel de un vistazo. A 32×32 se reconoce
   igual, y el documento grande está a un clic en la ficha. */
.tbl td.facthumb .thumb{width:32px;height:32px;object-fit:cover;border-radius:6px;border:1px solid var(--border);background:var(--surface2);display:block}
@media(max-width:820px){.tbl th.facthumb,.tbl td.facthumb,.tbl th.sparkcel,.tbl td.sparkcel{display:none}}
.tbl tr.sel{background:var(--brand-soft)}
.tbl tr.sel td:first-child{background:var(--brand-soft)}
/* La barra va PEGADA ABAJO, no empujando la tabla: si empujara el contenido, marcar la
   primera casilla movería todas las demás justo cuando se van a marcar. */
.selbar{position:sticky;bottom:14px;z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  margin-top:12px;padding:10px 14px;border-radius:12px;background:var(--ink);color:var(--surface);
  box-shadow:var(--sh-lg);font-size:13px}
.selbar b{font-size:15px}
.selbar .btn{background:rgba(255,255,255,.14);color:var(--surface);border-color:transparent}
.selbar .btn:hover{background:rgba(255,255,255,.24)}
@media(max-width:720px){ .drw{width:100vw} .drw-pill{height:38px} }

.modal-ov{position:fixed;inset:0;background:rgba(15,17,12,.44);backdrop-filter:blur(3px);z-index:150;display:grid;place-items:center;padding:20px}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:16px;box-shadow:var(--sh-lg);width:min(520px,96vw);max-height:90vh;overflow:auto}
.modal.wide{width:min(1080px,96vw)}

/* ── Elegir productos de una lista (Inventarios) ──────────────────────────────
   La lista tiene su PROPIO scroll y el pie queda fuera: con cuarenta filas
   apiladas en un móvil, una barra pegada al final del modal se pierde por
   debajo y hay que hacer scroll para encontrar el botón que se acaba de
   ganar el derecho a pulsar. */
.invcatbox{display:flex;flex-direction:column;gap:0}
.invcatlist{max-height:52vh;overflow:auto;margin:0 -4px;padding:0 4px}
.invcatsec{margin-bottom:14px}
.invcath{display:flex;align-items:center;gap:10px;justify-content:space-between;
  padding:6px 2px;font-size:12.5px;position:sticky;top:0;background:var(--surface);z-index:1}
/* Toda la fila es zona de toque: con el dedo, un cuadradito de 13 px no se da. */
.invcat{display:flex;align-items:center;gap:11px;padding:9px 8px;border-radius:10px;cursor:pointer}
.invcat:hover{background:var(--surface2)}
.invcat input[type=checkbox]{width:auto;flex:none}
.invcat .t1{font-size:13.5px;font-weight:600}
.invcat .t2{font-size:11.5px;color:var(--ink3)}
.invcat.yaesta{opacity:.5;cursor:default}
.invcat select{font-size:16px;padding:4px 6px;max-width:130px}
/* Ámbar, no relleno en silencio: la unidad de la factura es la de COMPRA y aquí se
   cuenta en otra. Que se vea cuál hay que mirar. */
.invcat select.revisa{border-color:#c8912a;background:#fdf6e6}
.invcatpie{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;
  padding-top:12px;border-top:1px solid var(--border)}
@media(max-width:520px){
  /* Casilla y nombre arriba; el resto a lo ancho debajo: los cuatro en una línea no
     entran en 374 px. */
  .invcat{flex-wrap:wrap;gap:8px}
  .invcat .grow{flex:1 1 60%}
  .invcat select,.invcat .pill,.invcat .mut{flex:1 1 100%;max-width:none}
  .invcatlist{max-height:46vh}
  .invcatpie .btn{flex:1 1 100%}
}
.modal:has(.rng){width:min(700px,96vw)}
.revrev{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;align-items:start}
.revrev .prev{position:sticky;top:0;background:var(--bg,#f4f2ec);border:1px solid var(--border);border-radius:12px;overflow:hidden;height:min(72vh,760px)}
.revrev .prev iframe,.revrev .prev embed,.revrev .prev img{width:100%;height:100%;border:0;object-fit:contain;background:#fff;display:block}
.revrev .prev .ld{display:grid;place-items:center;height:100%;color:var(--ink3)}
@media(max-width:820px){.revrev{grid-template-columns:1fr}.revrev .prev{position:static;height:52vh}}
.agnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.agturnos{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:720px){.agturnos{grid-template-columns:1fr}}
.agturno{background:var(--surface);border:1px solid var(--border2);border-radius:14px;overflow:hidden}
.agturno .th{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);font-weight:650}
.agres{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border)}
.agres:last-child{border-bottom:0}
.agres .hh{font-variant-numeric:tabular-nums;font-weight:650;min-width:44px}
.agres .who{flex:1;min-width:0}.agres .who .t2{color:var(--ink3);font-size:12px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.agweek{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:10px;overflow-x:auto}
.agday{background:var(--surface);border:1px solid var(--border2);border-radius:12px;padding:10px;cursor:pointer;min-height:96px}
.agday.hoy{border-color:var(--brand);box-shadow:0 0 0 2px color-mix(in srgb,var(--brand) 22%,transparent)}
.agday .dnum{font-weight:700;font-size:15px}.agday .dwd{color:var(--ink3);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.agday .tl{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px}
@media(max-width:720px){.agweek{grid-template-columns:1fr}.agday{min-height:auto}}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);font-size:15px;font-weight:650}
.modal-b{padding:18px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid .full{grid-column:1/-1}
/* Overlays compartidos (⌘K, drawer, toast, tooltip) */
.ovl{position:fixed;inset:0;background:rgba(15,17,12,.44);backdrop-filter:blur(3px);z-index:100;opacity:0;pointer-events:none;transition:opacity .15s}.ovl.open{opacity:1;pointer-events:auto}
.cmdkw{position:fixed;top:12vh;left:50%;transform:translateX(-50%) translateY(-8px) scale(.98);width:min(620px,92vw);background:var(--surface);border:1px solid var(--border2);border-radius:16px;box-shadow:var(--sh-lg);z-index:101;overflow:hidden;opacity:0;pointer-events:none;transition:.16s}.cmdkw.open{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0) scale(1)}
.cmdk .ci{display:flex;align-items:center;gap:11px;padding:15px 17px;border-bottom:1px solid var(--border)}.cmdk input{flex:1;border:0;background:none;font-size:15px;color:var(--ink);height:auto;padding:0}.cmdk input::placeholder{color:var(--ink3)}
.cmdk .cl{max-height:54vh;overflow-y:auto;padding:8px}.cmdk .cg{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);padding:10px 12px 4px}
.cmdk .cr{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;font-size:13.5px;font-weight:500;width:100%;text-align:left}.cmdk .cr .ci2{width:30px;height:30px;border-radius:9px;background:var(--surface2);display:grid;place-items:center;color:var(--ink2);flex:none}.cmdk .cr.sel{background:var(--brand-soft)}.cmdk .cr.sel .ci2{background:var(--brand);color:var(--brand-ink)}.cmdk .cr .kb{margin-left:auto;font-size:11px;color:var(--ink3)}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(460px,94vw);background:var(--surface);border-left:1px solid var(--border2);box-shadow:var(--sh-lg);z-index:101;transform:translateX(100%);transition:transform .22s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}.drawer.open{transform:none}
.drawer .dh{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border)}.drawer .db{flex:1;overflow-y:auto;padding:14px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:var(--sh-lg);z-index:200;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.tip{position:fixed;z-index:120;background:var(--ink);color:var(--bg);font-size:11.5px;font-weight:600;padding:6px 9px;border-radius:8px;pointer-events:none;opacity:0;transition:opacity .1s;white-space:nowrap}.tip.show{opacity:1}
.mscrim{display:none}
/* Editor de la web pública */
.webwrap{display:grid;grid-template-columns:minmax(0,440px) 1fr;gap:16px;align-items:start}
.webedit{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--sh-sm);overflow:hidden}
.webbar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.webfields{max-height:calc(100vh - 240px);overflow-y:auto;padding:6px 14px 14px}
.websec{padding:8px 0}.websec-h{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:12px 0 8px}
.webfield{margin-bottom:12px}.webfield>label{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.webmedia{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.webthumb{width:64px;height:44px;object-fit:cover;border-radius:8px;border:1px solid var(--border)}
.webthumb.empty{display:grid;place-items:center;font-size:10px;color:var(--ink3);background:var(--surface2)}
.webmiss{display:inline-block;margin-top:5px;margin-right:5px;font-size:10.5px;font-weight:600;color:var(--warning);background:var(--warning-soft);border-radius:6px;padding:1px 6px}
.webgal{display:flex;flex-wrap:wrap;gap:8px}
.webgi{position:relative;width:74px;height:56px;border-radius:8px;overflow:hidden;border:1px solid var(--border);cursor:grab}.webgi.dragging{opacity:.4}
.webgi img{width:100%;height:100%;object-fit:cover;display:block}
.webgx{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:6px;background:rgba(15,17,12,.6);color:#fff;font-size:11px;display:grid;place-items:center;line-height:1}
.webgadd{width:74px;height:56px;border:1px dashed var(--border2);border-radius:8px;display:grid;place-items:center;font-size:22px;color:var(--ink3);cursor:pointer}.webgadd:hover{border-color:var(--brand);color:var(--brand)}
.webprev{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--sh-sm);overflow:hidden;position:sticky;top:0}
.webprev-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border)}
.webprev iframe{width:100%;height:calc(100vh - 240px);border:0;display:block;background:var(--bg)}
.blkcard{border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--surface2)}
.blkcard-h{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.blkcard label{display:block;font-size:11.5px;font-weight:600;color:var(--ink2);margin-bottom:4px}
.iconbtn.sm{width:28px;height:28px;border-radius:8px}
.blkadd{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
@media (max-width:1080px){.webwrap{grid-template-columns:1fr}.webprev{position:static}.webprev iframe{height:60vh}.webfields{max-height:none}}
@media (max-width:1080px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}.c8,.c4,.c6,.c5,.c7{grid-column:span 12}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}.sidebar{position:fixed;z-index:50;width:min(280px,82vw);height:100vh;box-shadow:var(--sh-lg);transform:translateX(-100%);transition:transform .2s}.app.mopen .sidebar{transform:none}
  .app.mopen .mscrim{display:block;position:fixed;inset:0;background:rgba(15,17,12,.4);z-index:49}
  .g4,.g3,.g2{grid-template-columns:1fr}.sbtn span,.hidesm{display:none}.solosm{display:inline}.sbtn{min-width:0}.ph{flex-direction:column;align-items:flex-start}
  .content{padding:16px 15px 56px}.topbar{padding:0 12px;gap:8px}.wrap{max-width:100%}
  .btn{height:40px}.iconbtn{width:40px;height:40px}.chip{height:38px}.linkbtn{display:inline-block;padding:6px 2px}
  .form-grid{grid-template-columns:1fr}.ph h1{font-size:21px}

  /* LAS TRES CIFRAS, EN UNA LÍNEA. Apiladas ocupaban 450 px: en un iPhone había que deslizar
     una pantalla entera antes de ver la primera factura. Aquí no se quitan —son lo que se
     viene a mirar— se encogen. */
  .statsm{grid-template-columns:repeat(3,1fr);gap:8px}
  .statsm .stat{padding:9px 10px}
  .statsm .stat .lab{font-size:10.5px;gap:0}
  .statsm .stat .lab .ci{display:none}
  .statsm .stat .val{font-size:16px;letter-spacing:-.02em}
  .statsm .stat .sub{font-size:10.5px}

  /* LAS PESTAÑAS, EN UNA TIRA QUE SE DESLIZA. Partidas en dos filas se comían otros 60 px y
     además se leían como si «Configuración» fuera de otro grupo. */
  .tabstrip{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .tabstrip::-webkit-scrollbar{display:none}
  .tabstrip>.btn{flex:none}
  .tabstrip>.field{flex:1 0 190px}

  /* La cabecera de pantalla ocupaba 300 px para decir dónde estás. */
  .ph{gap:2px;margin-bottom:12px}.ph .eyebrow{font-size:10px}.ph .sub{font-size:12px}

  /* Los botones pequeños se quedaban en 30 px: el dedo de un adulto son ~45 px en
     pantalla, así que en móvil fallar el toque es lo normal. La regla de arriba solo
     tocaba `.btn`, y `.btn.sm` la ganaba por especificidad. */
  .btn.sm{height:36px;padding:0 13px}
  .seg button{height:36px;padding:0 14px}
  /* Las casillas nativas miden 13 px. Imposibles de acertar con el pulgar.
     Con `!important` a propósito: varias llevan un `style="width:auto;height:auto"` puesto
     para anular el ancho global de los inputs, y ese estilo en línea gana siempre. Ese
     ajuste se puso por el ancho, no para decidir el tamaño del área de toque. */
  input[type="checkbox"],input[type="radio"]{width:20px!important;height:20px!important;accent-color:var(--brand)}
  /* El buscador de ⌘K también se queda en 22 px de alto. */
  .cmdk .ci input{height:38px}

  /* TABLAS ANCHAS. No caben en 390 px y partirlas en tarjetas cambiaría demasiadas
     pantallas de golpe. Se hace lo que de verdad las vuelve usables: la primera columna
     —la que dice de QUIÉN o de QUÉ es la fila— se queda fija al desplazar, y un degradado
     en el borde avisa de que hay más a la derecha. Sin eso se desliza a ciegas. */
  .tw{position:relative}
  .tw::after{content:"";position:absolute;top:0;right:0;bottom:0;width:22px;pointer-events:none;
    background:linear-gradient(90deg,transparent,var(--surface));border-radius:0 12px 12px 0}
  .tbl th:first-child,.tbl td:first-child{position:sticky;left:0;z-index:1;background:var(--surface)}
  .tbl thead th:first-child{z-index:2}
  .tbl th,.tbl td{padding-left:11px;padding-right:11px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.enter>*{opacity:1!important;transform:none!important}}
/* Sara (IA) */
.sara-grid{align-items:start}
.scol{display:flex;flex-direction:column;gap:16px}
.schat-card{display:flex;flex-direction:column;height:min(72vh,680px)}
.schat{flex:1;min-height:0;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.sbub{display:flex}.sbub.me{justify-content:flex-end}.sbub.sara{justify-content:flex-start}
.sbub-in{max-width:80%;padding:9px 13px;border-radius:14px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.sbub.sara .sbub-in{background:var(--surface2);border:1px solid var(--border);border-bottom-left-radius:5px}
.sbub.me .sbub-in{background:var(--brand);color:var(--brand-ink);border-bottom-right-radius:5px}
.sprop{margin:0 18px;padding:13px 15px;border-radius:var(--r-md);background:var(--brand-soft);border:1px solid color-mix(in srgb,var(--brand) 24%,transparent)}
.sprop-t{font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);margin-bottom:5px}
.sprop-b{font-size:13.5px;line-height:1.5;color:var(--ink);margin-bottom:11px}
.sprop-a{display:flex;gap:8px}
.sbar{border-top:1px solid var(--border);padding:12px 14px;background:var(--surface)}
.sadj{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px}
.chip-x{margin-left:2px;width:16px;height:16px;border-radius:999px;display:inline-grid;place-items:center;font-size:14px;line-height:1;color:var(--ink3);background:var(--surface2)}.chip-x:hover{color:var(--danger);background:var(--danger-soft)}
.sbar-row{display:flex;align-items:flex-end;gap:9px}
.sattach{width:38px;height:38px;flex:none;border-radius:11px;border:1px solid var(--border);background:var(--surface);color:var(--ink2);display:grid;place-items:center;cursor:pointer;transition:.12s}.sattach:hover{border-color:var(--border2);color:var(--brand)}
.sbar-row textarea{flex:1;min-height:38px;max-height:120px;padding:9px 12px;border-radius:11px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font:inherit;font-size:13.5px;resize:none;line-height:1.45}.sbar-row textarea:focus{border-color:var(--brand);outline:none}
@media(max-width:820px){.schat-card{height:min(64vh,560px)}}
/* RR.HH. seguimiento */
.rrgrid{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}
@media(max-width:820px){.rrgrid{grid-template-columns:1fr}}
/* Móvil pequeño: que nada desborde y todo quepa en el ancho del teléfono */
@media (max-width:520px){
  .content{padding:14px 12px 48px}
  .topbar{padding:0 10px;gap:6px}
  .pick{max-width:150px}
  #waPill{display:none}
  .ph h1{font-size:20px}
  .toolbar{gap:8px}
  .toolbar .field{flex:1 1 140px}
  .row{flex-wrap:wrap}
  .tbl th,.tbl td{padding:8px 10px;font-size:12.5px}
  /* Marcar varias facturas para operar en lote es cosa de escritorio: en el móvil la columna
     de casillas se come 60 px de los 390 que hay, y la fila entera ya abre la ficha. */
  .tbl th.facsel,.tbl td.facsel{display:none}

  /* PRODUCTOS EN MÓVIL. La primera columna es pegajosa y con nombres largos se comía la
     pantalla entera: se veían los productos y ni un euro. Se recorta el nombre y se van las
     dos columnas de contexto —cuánto y cuándo— para que quepan las que contestan la pregunta:
     cuánto llevamos gastado y a cómo nos lo cobran. Siguen estando al abrir el producto. */
  .tbl th.cantcel,.tbl td.cantcel,.tbl th.ultcel,.tbl td.ultcel,.tbl th.provcol,.tbl td.provcol,.tbl th.catcol,.tbl td.catcol{display:none}
  /* La columna pegajosa se limita en píxeles, no en caracteres: es lo único que garantiza que
     el dinero quepa en 390 px pase lo que pase con los nombres. */
  .tbl td:first-child,.tbl th:first-child{max-width:180px}
  .linkbtn.prod{max-width:100%;font-size:13px}
  .provcel{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* El precio y su variación, en dos líneas si hace falta, para no ensanchar la columna. */
  .tbl td .pill{font-size:9.5px}
  .modal-b .form-grid{grid-template-columns:1fr}
  .ficha{grid-template-columns:1fr;gap:12px}
  .fic-doc{position:static;flex-direction:row;align-items:flex-start}
  .fic-ph,.fic-img{max-height:180px;width:auto;max-width:45%}
  .fic-doc .btn{align-self:center}
  .rng{flex-direction:column;gap:12px}
  .rngq{flex-direction:row;flex-wrap:wrap;width:auto;padding:0 0 12px;border-right:0;border-bottom:1px solid var(--border)}
  .rngcals .rngmes:last-child{display:none}
}
</style>

<body>
<div id="root"><div style="display:grid;place-items:center;height:100vh;color:var(--ink3)">Cargando panel…</div></div>
<div class="ovl" id="ovl"></div>
<div class="cmdkw cmdk" id="cmdk" role="dialog" aria-label="Buscar">
  <div class="ci"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="cmdin" placeholder="Buscar módulos, locales, acciones…" autocomplete="off" aria-label="Buscar"/><span class="kb mono" style="font-size:11px;color:var(--ink3)">esc</span></div>
  <div class="cl" id="cmdl"></div>
</div>
<aside class="drawer" id="drawer" aria-hidden="true"><div class="dh"><b id="drawerTitle" style="font-size:16px;letter-spacing:-.01em"></b><button class="iconbtn" id="drawerClose" aria-label="Cerrar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div><div class="db" id="drawerBody"></div></aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="tip" id="tip"></div>
<script src="/auth.js"></script>
<script src="app.js"></script>
</body>
