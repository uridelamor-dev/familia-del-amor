/* Formularios / campos (panel real) */

input,select{height:38px}

.field{display:flex;flex-direction:column;gap:4px}.field label{font-size:11px;color:var(--ink3);font-weight:600}
.linkbtn{color:var(--danger);font-weight:600;font-size:12px;background:none}.linkbtn:hover{text-decoration:underline}
.stars{color:var(--warning);letter-spacing:1px;font-size:14px}

.drawer .dh{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border)}.drawer .db{flex:1;overflow-y:auto;padding:14px}

.tip{position:fixed;z-index:120;background:var(--ink);color:var(--bg);font-size:11.5px;font-weight:600;padding:6px 9px;border-radius:8px;pointer-events:none;opacity:0;transition:opacity .1s;white-space:nowrap}.tip.show{opacity:1}
.mscrim{display:none}
/* Editor de la web pública */
.webwrap{display:grid;grid-template-columns:minmax(0,440px) 1fr;gap:16px;align-items:start}
.webedit{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--sh-sm);overflow:hidden}
.webbar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.webfields{max-height:calc(100vh - 240px);overflow-y:auto;padding:6px 14px 14px}
.websec{padding:8px 0}.websec-h{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:12px 0 8px}
.webfield{margin-bottom:12px}.webfield>label{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.webmedia{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.webthumb{width:64px;height:44px;object-fit:cover;border-radius:8px;border:1px solid var(--border)}
.webthumb.empty{display:grid;place-items:center;font-size:10px;color:var(--ink3);background:var(--surface2)}
.webmiss{display:inline-block;margin-top:5px;margin-right:5px;font-size:10.5px;font-weight:600;color:var(--warning);background:var(--warning-soft);border-radius:6px;padding:1px 6px}
.webgal{display:flex;flex-wrap:wrap;gap:8px}
.webgi{position:relative;width:74px;height:56px;border-radius:8px;overflow:hidden;border:1px solid var(--border);cursor:grab}.webgi.dragging{opacity:.4}
.webgi img{width:100%;height:100%;object-fit:cover;display:block}
.webgx{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:6px;background:rgba(15,17,12,.6);color:#fff;font-size:11px;display:grid;place-items:center;line-height:1}
.webgadd{width:74px;height:56px;border:1px dashed var(--border2);border-radius:8px;display:grid;place-items:center;font-size:22px;color:var(--ink3);cursor:pointer}.webgadd:hover{border-color:var(--brand);color:var(--brand)}
.webprev{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--sh-sm);overflow:hidden;position:sticky;top:0}
.webprev-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border)}
.webprev iframe{width:100%;height:calc(100vh - 240px);border:0;display:block;background:var(--bg)}
.blkcard{border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--surface2)}
.blkcard-h{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.blkcard label{display:block;font-size:11.5px;font-weight:600;color:var(--ink2);margin-bottom:4px}
.iconbtn.sm{width:28px;height:28px;border-radius:8px}
.blkadd{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
@media (max-width:1080px){.webwrap{grid-template-columns:1fr}.webprev{position:static}.webprev iframe{height:60vh}.webfields{max-height:none}}
@media (max-width:1080px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}.c8,.c4,.c6,.c5,.c7{grid-column:span 12}}
@media (max-width:820px){
  .app{grid-template-columns:0 1fr}.sidebar{position:fixed;z-index:50;width:min(280px,82vw);height:100vh;box-shadow:var(--sh-lg);transform:translateX(-100%);transition:transform .2s}.app.mopen .sidebar{transform:none}
  .app.mopen .mscrim{display:block;position:fixed;inset:0;background:rgba(15,17,12,.4);z-index:49}
  .g4,.g3,.g2{grid-template-columns:1fr}.sbtn span,.hidesm{display:none}.sbtn{min-width:0}.ph{flex-direction:column;align-items:flex-start}
  .content{padding:16px 15px 56px}.topbar{padding:0 12px;gap:8px}.wrap{max-width:100%}
  .btn{height:40px}.iconbtn{width:40px;height:40px}.chip{height:38px}.linkbtn{display:inline-block;padding:6px 2px}
  .form-grid{grid-template-columns:1fr}.ph h1{font-size:21px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.enter>*{opacity:1!important;transform:none!important}}
/* Sara (IA) */
.sara-grid{align-items:start}
.scol{display:flex;flex-direction:column;gap:16px}
.schat-card{display:flex;flex-direction:column;height:min(72vh,680px)}
.schat{flex:1;min-height:0;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.sbub{display:flex}.sbub.me{justify-content:flex-end}.sbub.sara{justify-content:flex-start}

.sbub.sara .sbub-in{background:var(--surface2);border:1px solid var(--border);border-bottom-left-radius:5px}
.sbub.me .sbub-in{background:var(--brand);color:var(--brand-ink);border-bottom-right-radius:5px}
.sprop{margin:0 18px;padding:13px 15px;border-radius:var(--r-md);background:var(--brand-soft);border:1px solid color-mix(in srgb,var(--brand) 24%,transparent)}
.sprop-t{font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);margin-bottom:5px}
.sprop-b{font-size:13.5px;line-height:1.5;color:var(--ink);margin-bottom:11px}
.sprop-a{display:flex;gap:8px}
.sbar{border-top:1px solid var(--border);padding:12px 14px;background:var(--surface)}
.sadj{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px}
.chip-x{margin-left:2px;width:16px;height:16px;border-radius:999px;display:inline-grid;place-items:center;font-size:14px;line-height:1;color:var(--ink3);background:var(--surface2)}.chip-x:hover{color:var(--danger);background:var(--danger-soft)}
.sbar-row{display:flex;align-items:flex-end;gap:9px}
.sattach{width:38px;height:38px;flex:none;border-radius:11px;border:1px solid var(--border);background:var(--surface);color:var(--ink2);display:grid;place-items:center;cursor:pointer;transition:.12s}.sattach:hover{border-color:var(--border2);color:var(--brand)}
.sbar-row textarea{flex:1;min-height:38px;max-height:120px;padding:9px 12px;border-radius:11px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font:inherit;font-size:13.5px;resize:none;line-height:1.45}.sbar-row textarea:focus{border-color:var(--brand);outline:none}
@media(max-width:820px){.schat-card{height:min(64vh,560px)}}
