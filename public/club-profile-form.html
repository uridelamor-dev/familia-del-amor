
<span class="profile-step">UN POQUITO MÁS · OPCIONAL</span>
<h2 id="profileTitle">Cuéntanos un poco más</h2>
<p class="profile-intro">Dos detalles para conocerte mejor.<br>Tu carnet funciona aunque no los rellenes.</p>
<form id="profileForm">
<div class="profile-field"><label for="profileTown">¿En qué población vives?</label><input id="profileTown" name="poblacion" autocomplete="address-level2" placeholder="Por ejemplo, Blanes" list="profileTowns"><datalist id="profileTowns"><option>Blanes</option><option>Girona</option><option>Lloret de Mar</option><option>Tordera</option></datalist><p class="profile-help">Solo la población, no necesitamos tu dirección.</p></div>
<div class="profile-field"><label id="birthdayLabel">¿Cuándo es tu cumpleaños?</label><div class="birthday-row" role="group" aria-labelledby="birthdayLabel"><select id="profileDay" aria-label="Día de cumpleaños"><option value="">Día</option></select><select id="profileMonth" aria-label="Mes de cumpleaños"><option value="">Mes</option></select><select id="profileYear" aria-label="Año de nacimiento"><option value="">Año</option></select></div><p class="profile-help">Tu fecha de nacimiento es opcional.</p></div>
<p class="profile-status" id="profileStatus" role="status" hidden></p>
<button class="alta-btn" type="submit">Guardar y ver mi carnet</button>
<button class="profile-skip" type="button" id="profileSkip">Ahora no, ir a mi carnet</button>

</form>
