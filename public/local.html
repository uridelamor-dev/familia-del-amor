<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Local · Familia del Amor</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="top">
      <button class="nav-toggle" id="navToggle" aria-label="Abrir menú" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div class="logo">
        <img src="assets/logos/Copia de Logo_proposta_DEL AMOR (1000 x 1000 px) (1920 x 1080 px).png" alt="Familia del Amor" />
      </div>
      <nav class="nav">
        <a href="index.html">Inicio</a>
        <a href="index.html#reservas">Reservar</a>
        <a href="nosotros.html">Nosotros</a>
        <a href="eventos.html">Eventos</a>
        <a href="index.html#contacto">Contacto</a>
        <div class="lang">
          <button data-lang="es" class="active">ES</button>
          <button data-lang="ca">CA</button>
          <button data-lang="en">EN</button>
        </div>
      </nav>
    </header>

    <main>
      <section class="hero" id="localHero">
        <div class="eyebrow" id="localType" data-i18n="hero_eyebrow">Local</div>
        <h1 id="localName">Local</h1>
        <p id="localDesc">Descripción</p>
        <div class="hero-cta" id="localCtas"></div>
      </section>

      <section class="block split">
        <div>
          <h2 data-i18n="section_location">Ubicación</h2>
          <ul id="localLocations"></ul>
        </div>
        <div class="tile" id="localCuriosity"></div>
      </section>

      <section class="block split">
        <div>
          <h2 data-i18n="section_hours">Horarios</h2>
          <div id="localHours"></div>
        </div>
        <div>
          <h2 data-i18n="section_map">Mapa</h2>
          <div id="localMap"></div>
        </div>
      </section>

      <section class="block">
        <div class="section-head">
          <h2 data-i18n="section_gallery">Galería</h2>
          <p data-i18n="section_gallery_sub">Imágenes del local.</p>
        </div>
        <div class="cards" id="localGallery"></div>
      </section>

      <section class="block">
        <div class="section-head">
          <h2 data-i18n="section_history">Historia</h2>
          <p data-i18n="section_history_sub">Curiosidades y recorrido del local.</p>
        </div>
        <div class="card" id="localHistory"></div>
      </section>
    </main>

    <script src="local.js"></script>
  </body>
</html>
