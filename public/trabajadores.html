<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trabajadores · Familia del Amor</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="panel">
    <header class="top">
      <div class="logo">
        <img src="assets/logos/Copia de Logo_proposta_DEL AMOR (1000 x 1000 px) (1920 x 1080 px).png" alt="Familia del Amor" />
      </div>
      <div class="user-bar">
        <span id="userBar"></span>
        <button class="btn ghost" id="logoutBtn">Salir</button>
      </div>
    </header>
    <main>
      <div class="panel-head">
        <span class="eyebrow">Panel interno</span>
        <h1>Trabajadores</h1>
        <p>Información interna y comunicados.</p>
      </div>
      <section class="block">
        <div class="section-head">
          <h2>Comunicados</h2>
          <p>Novedades y avisos del equipo.</p>
        </div>
        <div class="cards" id="annList"></div>
      </section>
    </main>
    <footer class="panel-footer">
      <div class="panel-footer-inner">
        <span>Familia del Amor · Panel interno</span>
        <a href="/">Ir al inicio →</a>
      </div>
    </footer>
    <script src="auth.js"></script>
    <script src="trabajadores.js"></script>
  </body>
</html>
