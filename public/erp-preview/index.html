<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Familia del Amor · ERP (prototipo)</title>
<meta name="robots" content="noindex"/>
</head>
<body>
<style>
/* ===== Reset / base ===== */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
:root{
  --bg:#F1EEE4; --bg2:#EAE6D9; --surface:#FBFAF6; --surface2:#F4F1E9;
  --border:#E4DFD1; --border2:#D3CDBB;
  --ink:#1B1F19; --ink2:#565B4E; --ink3:#868A79;
  --brand:#2F6B4F; --brand2:#245A41; --brand-ink:#F5FAF6; --brand-soft:#E4EFE7;
  --success:#2E9E6B; --success-soft:#E1F1E8;
  --warning:#B9822B; --warning-soft:#F5EBD8;
  --danger:#C24638; --danger-soft:#F6E2DE;
  --info:#3F6E93; --info-soft:#E1EAF1;
  --focus:#2F6B4F;
  --sh-sm:0 1px 2px rgba(28,38,26,.06),0 1px 3px rgba(28,38,26,.05);
  --sh-md:0 2px 6px rgba(28,38,26,.06),0 6px 18px rgba(28,38,26,.07);
  --sh-lg:0 8px 30px rgba(28,38,26,.12),0 2px 8px rgba(28,38,26,.08);
  --r-sm:8px; --r-md:14px; --r-lg:20px; --r-xl:26px;
  --fs:14px; --sb-w:246px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Menlo",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F110C; --bg2:#0B0D09; --surface:#171A13; --surface2:#1E2219;
  --border:#2A2F23; --border2:#3A4030;
  --ink:#ECEADF; --ink2:#AEB2A2; --ink3:#787C6D;
  --brand:#6BBE92; --brand2:#57A87D; --brand-ink:#0E1610; --brand-soft:#17281E;
  --success:#4FBE88; --success-soft:#132A1E;
  --warning:#D8A64A; --warning-soft:#2C2413;
  --danger:#E0685A; --danger-soft:#2E1613;
  --info:#79A4CB; --info-soft:#12212E;
  --focus:#6BBE92;
  --sh-sm:0 1px 2px rgba(0,0,0,.4);
  --sh-md:0 2px 8px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --sh-lg:0 12px 40px rgba(0,0,0,.55);
  color-scheme:dark;
}}
:root[data-theme="light"]{
  --bg:#F1EEE4; --bg2:#EAE6D9; --surface:#FBFAF6; --surface2:#F4F1E9;
  --border:#E4DFD1; --border2:#D3CDBB; --ink:#1B1F19; --ink2:#565B4E; --ink3:#868A79;
  --brand:#2F6B4F; --brand2:#245A41; --brand-ink:#F5FAF6; --brand-soft:#E4EFE7;
  --success:#2E9E6B; --success-soft:#E1F1E8; --warning:#B9822B; --warning-soft:#F5EBD8;
  --danger:#C24638; --danger-soft:#F6E2DE; --info:#3F6E93; --info-soft:#E1EAF1; --focus:#2F6B4F;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0F110C; --bg2:#0B0D09; --surface:#171A13; --surface2:#1E2219;
  --border:#2A2F23; --border2:#3A4030; --ink:#ECEADF; --ink2:#AEB2A2; --ink3:#787C6D;
  --brand:#6BBE92; --brand2:#57A87D; --brand-ink:#0E1610; --brand-soft:#17281E;
  --success:#4FBE88; --success-soft:#132A1E; --warning:#D8A64A; --warning-soft:#2C2413;
  --danger:#E0685A; --danger-soft:#2E1613; --info:#79A4CB; --info-soft:#12212E; --focus:#6BBE92;
  color-scheme:dark;
}
body{font-family:var(--font);font-size:var(--fs);color:var(--ink);background:var(--bg);
  -webkit-font-smoothing:antialiased;line-height:1.5;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
::selection{background:color-mix(in srgb,var(--brand) 28%,transparent)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}

/* ===== App shell ===== */
.app{display:grid;grid-template-columns:var(--sb-w) 1fr;height:100vh}
.app.collapsed{--sb-w:72px}
.sidebar{background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;
  min-width:0;transition:width .18s ease}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;min-height:60px}
.brand .logo{width:32px;height:32px;border-radius:9px;background:
  linear-gradient(150deg,var(--brand),var(--brand2));display:grid;place-items:center;color:var(--brand-ink);
  font-weight:700;flex:none;box-shadow:var(--sh-sm)}
.brand .bt{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.brand .bt b{font-size:14px;letter-spacing:-.01em;white-space:nowrap}
.brand .bt span{font-size:11px;color:var(--ink3);white-space:nowrap}
.app.collapsed .brand .bt,.app.collapsed .nav-group-t,.app.collapsed .navi span,.app.collapsed .sb-foot .u b,.app.collapsed .sb-foot .u span{display:none}
.nav{flex:1;overflow-y:auto;padding:6px 10px 14px}
.nav::-webkit-scrollbar{width:8px}.nav::-webkit-scrollbar-thumb{background:var(--border2);border-radius:8px}
.nav-group-t{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);
  padding:14px 10px 6px}
.navi{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:10px;color:var(--ink2);
  font-weight:500;font-size:13.5px;position:relative;transition:background .12s,color .12s;white-space:nowrap}
.navi:hover{background:var(--surface2);color:var(--ink)}
.navi.active{background:var(--surface);color:var(--ink);box-shadow:var(--sh-sm)}
.navi.active::before{content:"";position:absolute;left:-10px;top:50%;transform:translateY(-50%);
  width:3px;height:18px;border-radius:3px;background:var(--brand)}
.navi .ico{flex:none;color:var(--ink3)}
.navi.active .ico,.navi:hover .ico{color:var(--brand)}
.navi .badge{margin-left:auto;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;
  background:var(--danger-soft);color:var(--danger)}
.app.collapsed .navi{justify-content:center;padding:9px}
.app.collapsed .navi .badge{position:absolute;top:2px;right:4px;margin:0;padding:0;width:7px;height:7px;
  border-radius:999px;overflow:hidden;color:transparent}
.sb-foot{border-top:1px solid var(--border);padding:10px}
.sb-foot .u{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px}
.sb-foot .u:hover{background:var(--surface2)}
.sb-foot .u .txt{display:flex;flex-direction:column;min-width:0}
.sb-foot .u b{font-size:13px}.sb-foot .u span{font-size:11px;color:var(--ink3)}

.main{display:flex;flex-direction:column;min-width:0;height:100vh}
.topbar{height:60px;flex:none;display:flex;align-items:center;gap:12px;padding:0 22px;
  border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:saturate(1.4) blur(8px);position:sticky;top:0;z-index:20}
.iconbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink2);
  transition:background .12s,color .12s}
.iconbtn:hover{background:var(--surface2);color:var(--ink)}
.searchbtn{display:flex;align-items:center;gap:10px;height:36px;padding:0 12px;border-radius:10px;
  border:1px solid var(--border);background:var(--surface);color:var(--ink3);min-width:230px;transition:.12s}
.searchbtn:hover{border-color:var(--border2);color:var(--ink2)}
.searchbtn .kbd{margin-left:auto;font-family:var(--mono);font-size:11px;background:var(--surface2);
  border:1px solid var(--border);border-radius:6px;padding:1px 6px;color:var(--ink3)}
.estsel{display:flex;align-items:center;gap:9px;height:38px;padding:0 12px;border-radius:11px;
  border:1px solid var(--border);background:var(--surface);font-weight:600;font-size:13px;transition:.12s}
.estsel:hover{border-color:var(--border2);box-shadow:var(--sh-sm)}
.estsel .dot{width:8px;height:8px;border-radius:999px;background:var(--brand)}
.estsel .car{color:var(--ink3)}
.spacer{flex:1}
.avatar{width:34px;height:34px;border-radius:999px;background:linear-gradient(140deg,var(--brand),var(--brand2));
  color:var(--brand-ink);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.bell{position:relative}
.bell .n{position:absolute;top:2px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;
  background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;
  border:2px solid var(--bg)}

.content{flex:1;overflow-y:auto;padding:26px 28px 60px;scroll-behavior:smooth}
.content::-webkit-scrollbar{width:10px}.content::-webkit-scrollbar-thumb{background:var(--border2);border-radius:10px}
.wrap{max-width:1240px;margin:0 auto}

/* ===== Page header ===== */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--brand);
  display:flex;align-items:center;gap:7px;margin-bottom:8px}
.eyebrow::before{content:"";width:14px;height:2px;border-radius:2px;background:var(--brand)}
.ph h1{margin:0;font-size:26px;letter-spacing:-.02em;text-wrap:balance;font-weight:680}
.ph .sub{color:var(--ink2);margin-top:6px;font-size:14px;max-width:60ch}
.ph .acts{display:flex;gap:9px;flex:none}
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 15px;border-radius:11px;
  font-weight:600;font-size:13px;border:1px solid transparent;transition:.13s;white-space:nowrap}
.btn.primary{background:var(--brand);color:var(--brand-ink);box-shadow:var(--sh-sm)}
.btn.primary:hover{background:var(--brand2);transform:translateY(-1px);box-shadow:var(--sh-md)}
.btn.ghost{background:var(--surface);border-color:var(--border);color:var(--ink)}
.btn.ghost:hover{border-color:var(--border2);background:var(--surface2)}

/* ===== Grid & cards ===== */
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.col-8{grid-column:span 8}.col-4{grid-column:span 4}.col-6{grid-column:span 6}.col-12{grid-column:span 12}
.g12{grid-template-columns:repeat(12,1fr)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);
  box-shadow:var(--sh-sm);padding:18px}
.card.pad0{padding:0;overflow:hidden}
.card.lift{transition:transform .15s,box-shadow .15s}
.card.lift:hover{transform:translateY(-2px);box-shadow:var(--sh-md);border-color:var(--border2)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-h h3{margin:0;font-size:14.5px;letter-spacing:-.01em;font-weight:650}
.card-h .mut{font-size:12px;color:var(--ink3)}
.link{color:var(--brand);font-weight:600;font-size:12.5px;display:inline-flex;align-items:center;gap:4px}
.link:hover{text-decoration:underline}

/* stat tile */
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:16px 17px;
  box-shadow:var(--sh-sm);display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.stat .lab{font-size:12px;color:var(--ink2);font-weight:550;display:flex;align-items:center;gap:7px}
.stat .lab .ci{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.stat .val{font-size:29px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.stat .val small{font-size:15px;font-weight:600;color:var(--ink3);letter-spacing:0}
.stat .delta{font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.up{color:var(--success)}.down{color:var(--danger)}.flat{color:var(--ink3)}
.stat .spark{position:absolute;right:12px;bottom:10px;opacity:.9}

/* pills / chips */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;
  border-radius:999px;background:var(--surface2);color:var(--ink2);border:1px solid var(--border)}
.pill .d{width:6px;height:6px;border-radius:999px;background:currentColor}
.pill.ok{background:var(--success-soft);color:var(--success);border-color:transparent}
.pill.warn{background:var(--warning-soft);color:var(--warning);border-color:transparent}
.pill.bad{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.pill.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.pill.brand{background:var(--brand-soft);color:var(--brand);border-color:transparent}
.chip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px;border-radius:999px;
  border:1px solid var(--border);background:var(--surface);font-size:12.5px;font-weight:550;color:var(--ink2);transition:.12s}
.chip:hover{border-color:var(--border2);color:var(--ink)}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:transparent}

/* list rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:13px;padding:13px 16px;border-top:1px solid var(--border)}
.row:first-child{border-top:0}
.row:hover{background:var(--surface2)}
.row .grow{flex:1;min-width:0}
.row .t1{font-weight:600;font-size:13.5px;letter-spacing:-.01em}
.row .t2{font-size:12px;color:var(--ink3);margin-top:2px}
.mono-num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px}
.ava-sm{width:32px;height:32px;border-radius:999px;display:grid;place-items:center;font-weight:650;font-size:12px;
  color:var(--brand);background:var(--brand-soft);flex:none}
.sev{width:4px;align-self:stretch;border-radius:4px;flex:none;background:var(--ink3)}
.sev.hi{background:var(--danger)}.sev.md{background:var(--warning)}.sev.lo{background:var(--success)}

/* attention feed */
.att{display:flex;gap:13px;padding:14px 16px;border-top:1px solid var(--border);align-items:flex-start}
.att:first-child{border-top:0}
.att .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.ic.bad{background:var(--danger-soft);color:var(--danger)}.ic.warn{background:var(--warning-soft);color:var(--warning)}
.ic.info{background:var(--info-soft);color:var(--info)}.ic.ok{background:var(--success-soft);color:var(--success)}
.att .grow{flex:1;min-width:0}.att .grow b{font-size:13.5px;font-weight:600}
.att .grow p{margin:3px 0 0;font-size:12.5px;color:var(--ink2)}
.att .when{font-size:11.5px;color:var(--ink3);white-space:nowrap}

/* gauge / progress */
.prog{height:7px;border-radius:999px;background:var(--surface2);overflow:hidden}
.prog>i{display:block;height:100%;border-radius:999px;background:var(--brand);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.prog.warn>i{background:var(--warning)}.prog.bad>i{background:var(--danger)}

/* establishment card */
.est{display:flex;flex-direction:column;gap:14px}
.est .top{display:flex;align-items:flex-start;gap:12px}
.est .em{width:44px;height:44px;border-radius:12px;background:var(--brand-soft);color:var(--brand);
  display:grid;place-items:center;font-weight:700;flex:none;font-size:15px}
.est .nm{font-weight:660;letter-spacing:-.01em;font-size:15px}
.est .co{font-size:12px;color:var(--ink3)}
.est-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;text-align:center;
  background:var(--surface2);border-radius:12px;padding:11px 0}
.est-metrics div b{display:block;font-size:17px;font-weight:700;letter-spacing:-.02em}
.est-metrics div span{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);
  font-weight:600;padding:11px 14px;border-bottom:1px solid var(--border)}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--border)}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:var(--surface2)}
.tbl th.r,.tbl td.r{text-align:right}

/* kanban */
.kan{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
.kcol{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-md);padding:12px}
.kcol .kh{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 10px;font-weight:650;font-size:13px}
.kcard{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:12px;margin-top:9px;box-shadow:var(--sh-sm)}
.kcard:hover{border-color:var(--border2)}
.kcard .kt{font-weight:600;font-size:13px}
.kcard .km{font-size:11.5px;color:var(--ink3);margin-top:3px;display:flex;gap:8px;align-items:center}

/* Sara chat */
.sara-wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;align-items:start}
.chat{display:flex;flex-direction:column;gap:12px;padding:6px 2px}
.msg{max-width:82%;padding:11px 14px;border-radius:15px;font-size:13.5px;line-height:1.45}
.msg.them{background:var(--surface2);border:1px solid var(--border);border-bottom-left-radius:5px;align-self:flex-start}
.msg.her{background:var(--brand);color:var(--brand-ink);border-bottom-right-radius:5px;align-self:flex-end}
.msg .mn{font-size:10.5px;opacity:.7;margin-bottom:3px;font-weight:600}
.reco{display:flex;gap:12px;padding:13px;border:1px solid var(--border);border-radius:12px;background:var(--surface);align-items:flex-start}
.reco .rc{width:34px;height:34px;border-radius:10px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}

/* toggles */
.tog{width:40px;height:23px;border-radius:999px;background:var(--border2);position:relative;transition:.15s;flex:none}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:999px;background:#fff;
  box-shadow:var(--sh-sm);transition:.15s}
.tog.on{background:var(--brand)}.tog.on::after{left:19px}
.setrow{display:flex;align-items:center;gap:14px;padding:15px 4px;border-top:1px solid var(--border)}
.setrow:first-child{border-top:0}
.setrow .grow b{font-size:13.5px;font-weight:600}.setrow .grow p{margin:2px 0 0;font-size:12px;color:var(--ink3)}

/* skeleton */
.sk{background:linear-gradient(90deg,var(--surface2) 25%,color-mix(in srgb,var(--surface2) 60%,var(--surface)) 37%,var(--surface2) 63%);
  background-size:400% 100%;animation:sh 1.3s ease infinite;border-radius:8px}
@keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}
.skel .stat,.skel .card{pointer-events:none}

/* view enter animation */
.enter>*{opacity:0;transform:translateY(8px);animation:rise .5s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}

/* command palette */
.ovl{position:fixed;inset:0;background:rgba(15,17,12,.42);backdrop-filter:blur(3px);z-index:100;
  display:flex;align-items:flex-start;justify-content:center;padding-top:12vh;opacity:0;pointer-events:none;transition:opacity .14s}
.ovl.open{opacity:1;pointer-events:auto}
.cmdk{width:min(600px,92vw);background:var(--surface);border:1px solid var(--border2);border-radius:16px;
  box-shadow:var(--sh-lg);overflow:hidden;transform:translateY(-8px) scale(.98);transition:transform .16s}
.ovl.open .cmdk{transform:none}
.cmdk .ci{display:flex;align-items:center;gap:11px;padding:15px 17px;border-bottom:1px solid var(--border)}
.cmdk input{flex:1;border:0;background:none;font-size:15px;color:var(--ink)}
.cmdk input::placeholder{color:var(--ink3)}
.cmdk .cl{max-height:52vh;overflow-y:auto;padding:8px}
.cmdk .cg{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);padding:10px 12px 4px}
.cmdk .cr{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;font-size:13.5px;font-weight:500}
.cmdk .cr .ci2{width:30px;height:30px;border-radius:9px;background:var(--surface2);display:grid;place-items:center;color:var(--ink2);flex:none}
.cmdk .cr.sel{background:var(--brand-soft)}.cmdk .cr.sel .ci2{background:var(--brand);color:var(--brand-ink)}
.cmdk .cr .kb{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink3)}

/* misc */
.divider{height:1px;background:var(--border);margin:2px 0}
.muted{color:var(--ink3)}
.flex{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wrapf{display:flex;flex-wrap:wrap;gap:9px}
.hl{color:var(--brand);font-weight:650}
.big-num{font-size:44px;font-weight:750;letter-spacing:-.035em;line-height:1}

function area(data,{w=460,h=120,pad=6,stroke="var(--brand)",fill=true,dot=true}={}){
  const mn=Math.min(...data),mx=Math.max(...data),rng=(mx-mn)||1;
  const X=i=>pad+i*((w-2*pad)/(data.length-1));
  const Y=v=>h-pad-((v-mn)/rng)*(h-2*pad-14)-4;
  let d="",a="";
  data.forEach((v,i)=>{const x=X(i),y=Y(v);d+=(i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1)+" ";});
  a=`M${pad} ${h-pad} L`+data.map((v,i)=>X(i).toFixed(1)+" "+Y(v).toFixed(1)).join(" L")+` L${w-pad} ${h-pad} Z`;
  const gid="g"+Math.random().toString(36).slice(2,7);
  const lx=X(data.length-1),ly=Y(data[data.length-1]);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" style="display:block">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${stroke}" stop-opacity=".22"/><stop offset="1" stop-color="${stroke}" stop-opacity="0"/></linearGradient></defs>
    ${[0.5,0.5].map(()=>'').join('')}
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--border)" stroke-width="1"/>
    ${fill?`<path d="${a}" fill="url(#${gid})"/>`:""}
    <path d="${d}" fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    ${dot?`<circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="3.6" fill="var(--surface)" stroke="${stroke}" stroke-width="2"/>`:""}
  </svg>`;
}
function sparkTiny(data,stroke="var(--brand)",w=92,h=34){return area(data,{w,h,pad:3,stroke,fill:true,dot:true});}
function bars(data,labels,{h=150,color="var(--brand)"}={}){
  const mx=Math.max(...data)||1;
  return `<div style="display:flex;align-items:flex-end;gap:10px;height:${h}px;padding-top:6px">
   ${data.map((v,i)=>{const bh=Math.max(6,(v/mx)*(h-26));return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0">
     <div style="font-size:11px;font-weight:650;color:var(--ink2);font-variant-numeric:tabular-nums">${v}%</div>
     <div style="width:100%;height:${bh}px;background:linear-gradient(180deg,${color},color-mix(in srgb,${color} 72%,transparent));border-radius:7px 7px 3px 3px;transition:height .5s"></div>
     <div style="font-size:10.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%">${labels[i]}</div></div>`;}).join("")}
  </div>`;
}
function donut(segs,{size=140}={}){
  const tot=segs.reduce((a,s)=>a+s.v,0);let acc=0;const R=54,C=2*Math.PI*R;
  const arcs=segs.map(s=>{const frac=s.v/tot;const len=frac*C;const dash=`${Math.max(0,len-3)} ${C-Math.max(0,len-3)}`;
    const off=-acc*C+C*0.25;acc+=frac;return `<circle cx="70" cy="70" r="${R}" fill="none" stroke="${s.c}" stroke-width="15" stroke-dasharray="${dash}" stroke-dashoffset="${off}" transform="rotate(-90 70 70)" stroke-linecap="round"/>`;}).join("");
  return `<svg viewBox="0 0 140 140" width="${size}" height="${size}"><circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--surface2)" stroke-width="15"/>${arcs}
    <text x="70" y="66" text-anchor="middle" font-size="22" font-weight="700" fill="var(--ink)" style="letter-spacing:-1px">${tot}</text>
    <text x="70" y="84" text-anchor="middle" font-size="10" fill="var(--ink3)">pedidos/mes</text></svg>`;
}

function stat({lab,ico,val,unit,delta,dir,data}){
  const arrow=dir==="up"?icon("arrowU",13):dir==="down"?icon("arrowD",13):"";

  return `<div class="stat">

    <div class="val tnum">${val}${unit?` <small>${unit}</small>`:""}</div>
    ${delta!=null?`<div class="delta ${cls}">${arrow}${delta}</div>`:""}
    ${data?`<div class="spark">${sparkTiny(data,"var(--brand)")}</div>`:""}
  </div>`;
}
function card(title,body,{right="",cls="",h=true}={}){

/* meta per route */
const META={
  dashboard:["Buenos días, Uriel","Dashboard ejecutivo","El estado de todo el grupo, de un vistazo.",`<button class="btn ghost">${icon("cal",15)} Hoy</button><button class="btn primary">${icon("plus",15)} Acción rápida</button>`],

};

/* ============================== SHELL & ROUTER ============================== */
let current="dashboard", collapsed=false, cmdSel=0, cmdList=[];
function sidebar(){
  return `<aside class="sidebar">
    <div class="brand"><div class="logo">FA</div><div class="bt"><b>Familia del Amor</b><span>Sistema operativo interno</span></div></div>
    <nav class="nav">${NAV.map(g=>`<div class="nav-group-t">${g.g}</div>${g.items.map(it=>`
      <a class="navi ${it[0]===current?'active':''}" data-go="${it[0]}">${`<span class="ico">${icon(it[2])}</span>`}<span>${it[1]}</span>${it[3]?`<span class="badge">${it[3]}</span>`:""}</a>`).join("")}`).join("")}</nav>
    <div class="sb-foot"><div class="u"><span class="avatar">UD</span><div class="txt"><b>Uriel de la Mora</b><span>Dirección · acceso global</span></div></div></div>
  </aside>`;
}
function topbar(){
  return `<header class="topbar">
    <button class="iconbtn" id="mtoggle" title="Menú">${icon("menu")}</button>
    <button class="estsel" id="estsel"><span class="dot"></span> Todos los establecimientos <span class="car">${icon("chevD",16)}</span></button>
    <button class="searchbtn" id="opencmd">${icon("search",16)}<span>Buscar o ir a…</span><span class="kbd">⌘K</span></button>
    <div class="spacer"></div>
    <button class="iconbtn bell hidesm" data-go="alertas" title="Alertas">${icon("bell")}<span class="n">4</span></button>
    <button class="iconbtn" id="theme" title="Tema">${icon("sun")}</button>
    <span class="avatar" title="Uriel">UD</span>
  </header>`;
}
function pageHeader(k){const m=META[k];return `<div class="ph"><div><div class="eyebrow">${m[0]}</div><h1>${m[1]}</h1><div class="sub">${m[2]}</div></div><div class="acts">${m[3]||""}</div></div>`;}
function skeleton(){
  return `<div class="skel enter"><div class="ph"><div><div class="sk" style="width:120px;height:12px;margin-bottom:12px"></div><div class="sk" style="width:280px;height:26px"></div></div></div>
   <div class="grid g4">${Array(4).fill(`<div class="stat"><div class="sk" style="width:60%;height:12px"></div><div class="sk" style="width:50%;height:28px;margin-top:12px"></div></div>`).join("")}</div>
   <div class="grid g2" style="margin-top:16px">${Array(2).fill(`<div class="card"><div class="sk" style="width:40%;height:14px"></div><div class="sk" style="height:160px;margin-top:16px"></div></div>`).join("")}</div></div>`;
}
function render(k,{skip=false}={}){
  current=k;const root=document.getElementById("root");
  root.innerHTML=`<div class="app${collapsed?' collapsed':''}" id="appEl">${sidebar()}<div class="main">${topbar()}<main class="content"><div class="wrap" id="view"></div></main></div>${overlay()}</div>`;
  wire();
  const view=document.getElementById("view");
  if(skip){paint(k);return;}
  view.innerHTML=skeleton();
  setTimeout(()=>paint(k),260);
}
function paint(k){
  const view=document.getElementById("view");
  view.innerHTML=pageHeader(k)+`<div class="enter">${(V[k]||V.dashboard)()}</div>`;
  // stagger
  view.querySelectorAll(".enter > *").forEach((n,i)=>n.style.animationDelay=(i*45)+"ms");
  document.querySelector(".content").scrollTop=0;
}
function go(k){if(!META[k])k="dashboard";location.hash="#/"+k;}
function overlay(){
  return `<div class="ovl" id="ovl"><div class="cmdk" role="dialog" aria-label="Buscar">
    <div class="ci">${icon("search",18)}<input id="cmdin" placeholder="Buscar módulos, acciones, establecimientos…" autocomplete="off"/><span class="kbd" style="font-family:var(--mono);font-size:11px;color:var(--ink3)">esc</span></div>
    <div class="cl" id="cmdl"></div></div></div>`;
}
const ALLCMD=[
  ...Object.keys(META).map(k=>({t:META[k][1],s:"Ir a",g:"Navegación",k,ic:(NAV.flatMap(x=>x.items).find(i=>i[0]===k)||[])[2]||"dash"})),
  {t:"Crear reserva",s:"Acción",g:"Acciones",k:"dashboard",ic:"plus"},
  {t:"Nueva incidencia",s:"Acción",g:"Acciones",k:"mantenimiento",ic:"wrench"},
  {t:"Exportar clientes (CSV)",s:"Acción",g:"Acciones",k:"clientes",ic:"doc"},
  {t:"Reconectar WhatsApp",s:"Sara",g:"Acciones",k:"sara",ic:"wifi"},
  {t:"Cambiar tema",s:"Apariencia",g:"Acciones",k:"__theme",ic:"sun"},
];
function openCmd(){const o=document.getElementById("ovl");o.classList.add("open");cmdSel=0;
  const inp=document.getElementById("cmdin");inp.value="";fillCmd("");setTimeout(()=>inp.focus(),30);}
function closeCmd(){document.getElementById("ovl").classList.remove("open");}
function fillCmd(q){
  q=q.toLowerCase().trim();
  cmdList=ALLCMD.filter(c=>!q||c.t.toLowerCase().includes(q)||c.s.toLowerCase().includes(q));
  if(cmdSel>=cmdList.length)cmdSel=0;
  const groups={};cmdList.forEach((c,i)=>{(groups[c.g]=groups[c.g]||[]).push({...c,i});});
  document.getElementById("cmdl").innerHTML=Object.entries(groups).map(([g,items])=>`<div class="cg">${g}</div>${items.map(c=>`
    <div class="cr ${c.i===cmdSel?'sel':''}" data-i="${c.i}"><span class="ci2">${icon(c.ic,16)}</span>${c.t}<span class="kb">${c.s}</span></div>`).join("")}`).join("")||`<div class="cg">Sin resultados</div>`;
}
function runCmd(c){closeCmd();if(!c)return;if(c.k==="__theme"){toggleTheme();return;}go(c.k);}
function toggleTheme(){
  const r=document.documentElement;const cur=r.getAttribute("data-theme");
  const isDark=cur==="dark"||(!cur&&matchMedia("(prefers-color-scheme:dark)").matches);
  r.setAttribute("data-theme",isDark?"light":"dark");
  try{localStorage.setItem("fa-theme",isDark?"light":"dark");}catch(e){}
}
function setTheme(v){const r=document.documentElement;if(v==="auto"){r.removeAttribute("data-theme");try{localStorage.removeItem("fa-theme")}catch(e){}}else{r.setAttribute("data-theme",v);try{localStorage.setItem("fa-theme",v)}catch(e){}}}
function wire(){
  document.querySelectorAll("[data-go]").forEach(n=>n.onclick=e=>{e.preventDefault();document.getElementById("appEl").classList.remove("mopen");go(n.getAttribute("data-go"));});
  document.getElementById("opencmd").onclick=openCmd;
  document.getElementById("estsel").onclick=openCmd;
  document.getElementById("theme").onclick=toggleTheme;
  document.getElementById("mtoggle").onclick=()=>{const a=document.getElementById("appEl");
    if(innerWidth<=820)a.classList.toggle("mopen");else{collapsed=!collapsed;a.classList.toggle("collapsed");}};
  const ovl=document.getElementById("ovl");ovl.onclick=e=>{if(e.target===ovl)closeCmd();};
  const inp=document.getElementById("cmdin");
  inp.oninput=e=>fillCmd(e.target.value);
  document.getElementById("cmdl").onclick=e=>{const r=e.target.closest(".cr");if(r)runCmd(cmdList[+r.dataset.i]);};
  document.querySelectorAll("[data-theme-set]").forEach(b=>b.onclick=()=>{setTheme(b.getAttribute("data-theme-set"));
    document.querySelectorAll("[data-theme-set]").forEach(x=>x.classList.remove("on"));b.classList.add("on");});
}
document.addEventListener("keydown",e=>{
  const open=document.getElementById("ovl")?.classList.contains("open");
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();open?closeCmd():openCmd();return;}
  if(!open)return;
  if(e.key==="Escape")closeCmd();
  else if(e.key==="ArrowDown"){e.preventDefault();cmdSel=Math.min(cmdList.length-1,cmdSel+1);fillCmd(document.getElementById("cmdin").value);document.querySelector(".cr.sel")?.scrollIntoView({block:"nearest"});}
  else if(e.key==="ArrowUp"){e.preventDefault();cmdSel=Math.max(0,cmdSel-1);fillCmd(document.getElementById("cmdin").value);document.querySelector(".cr.sel")?.scrollIntoView({block:"nearest"});}
  else if(e.key==="Enter"){e.preventDefault();runCmd(cmdList[cmdSel]);}
});
window.addEventListener("hashchange",()=>{const k=location.hash.replace("#/","")||"dashboard";render(k);});
(function init(){
  try{const t=localStorage.getItem("fa-theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}
  const k=location.hash.replace("#/","")||"dashboard";render(k,{skip:false});
})();
</script>
