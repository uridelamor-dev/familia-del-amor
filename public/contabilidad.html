<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contabilidad · Familia del Amor</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="panel">
    <header class="top">
      <div class="logo">
        <img src="assets/logos/Copia de Logo_proposta_DEL AMOR (1000 x 1000 px) (1920 x 1080 px).png" alt="Familia del Amor" />
      </div>
      <div class="user-bar">
        <span id="userBar"></span>
        <button class="btn ghost" id="logoutBtn">Salir</button>
      </div>
    </header>
    <main>
      <div class="panel-head">
        <span class="eyebrow">Panel interno</span>
        <h1>Contabilidad</h1>
        <p>Exportes y reportes financieros.</p>
      </div>
      <section class="block">
        <div class="section-head">
          <h2>Exportaciones</h2>
          <p>Descarga los datos para tu gestoría.</p>
        </div>
        <div class="cards">
          <div class="card">
            <strong>Exportar reservas</strong><br />
            CSV con todas las reservas.
            <div class="panel-actions">
              <a class="btn" id="exportReservas" href="#">Exportar CSV</a>
            </div>
          </div>
        </div>
      </section>
    </main>
    <footer class="panel-footer">
      <div class="panel-footer-inner">
        <span>Familia del Amor · Panel interno</span>
        <a href="/">Ir al inicio →</a>
      </div>
    </footer>
    <script src="auth.js"></script>
    <script src="contabilidad.js"></script>
  </body>
</html>
