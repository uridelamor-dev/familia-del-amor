<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contabilidad · Familia del Amor</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="top">
      <div class="logo">
        <img src="assets/logos/Copia de Logo_proposta_DEL AMOR (1000 x 1000 px) (1920 x 1080 px).png" alt="Familia del Amor" />
      </div>
      <div class="user-bar">
        <span id="userBar"></span>
        <button class="btn ghost" id="logoutBtn">Salir</button>
      </div>
    </header>
    <main>
      <section class="hero">
        <div class="eyebrow">Panel interno</div>
        <h1>Contabilidad</h1>
        <p>Exportes y reportes financieros.</p>
      </section>
      <section class="block">
        <div class="cards">
          <div class="card">
            <strong>Exportar reservas</strong><br />
            CSV con todas las reservas.
            <div class="panel-actions">
              <a class="btn" id="exportReservas" href="#">Exportar CSV</a>
            </div>
          </div>
          <div class="card">Cuadres mensuales (próximo paso).</div>
          <div class="card">Facturación y gastos (próximo paso).</div>
        </div>
      </section>
    </main>
    <footer class="footer">
      <div class="footer-inner">
        <span>Volver</span>
        <a class="btn" href="index.html">Ir al sitio</a>
      </div>
    </footer>
    <script src="auth.js"></script>
    <script src="contabilidad.js"></script>
  </body>
</html>
