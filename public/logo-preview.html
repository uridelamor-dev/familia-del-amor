<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Previsualización de Logos</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem; background:#f6f2ea; color:#141210; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.5rem; }
      .card { background:#fffaf2; border:1px solid #eadfce; border-radius:12px; padding:1rem; }
      .logo-wrap { background:#141210; padding:1rem; border-radius:10px; display:flex; justify-content:center; }
      img { max-width: 180px; height: auto; display:block; }
      code { font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <h1>Logos disponibles</h1>
    <p>Indícame qué logo corresponde a cada empresa usando el nombre de archivo.</p>
    <div class="grid">
      <div class="card">
        <div class="logo-wrap"><img src="assets/logos/1.svg" alt="logo 1" /></div>
        <p><code>1.svg</code></p>
      </div>
      <div class="card">
        <div class="logo-wrap"><img src="assets/logos/2.svg" alt="logo 2" /></div>
        <p><code>2.svg</code></p>
      </div>
      <div class="card">
        <div class="logo-wrap"><img src="assets/logos/3.svg" alt="logo 3" /></div>
        <p><code>3.svg</code></p>
      </div>
      <div class="card">
        <div class="logo-wrap"><img src="assets/logos/4.svg" alt="logo 4" /></div>
        <p><code>4.svg</code></p>
      </div>
      <div class="card">
        <div class="logo-wrap"><img src="assets/logos/5.svg" alt="logo 5" /></div>
        <p><code>5.svg</code></p>
      </div>
      <div class="card">
        <div class="logo-wrap"><img src="assets/logos/6.svg" alt="logo 6" /></div>
        <p><code>6.svg</code></p>
      </div>
      <div class="card">
        <div class="logo-wrap"><img src="assets/logos/7.svg" alt="logo 7" /></div>
        <p><code>7.svg</code></p>
      </div>
    </div>
  </body>
</html>
