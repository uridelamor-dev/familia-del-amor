<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acceso · Familia del Amor</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .login-wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
      }
      .login-box {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-md);
        padding: 2.5rem 2rem;
        width: 100%;
        max-width: 380px;
      }
      .login-box .logo {
        text-align: center;
        margin-bottom: 2rem;
      }
      .login-box .logo img {
        height: 60px;
        object-fit: contain;
      }
      .login-box h1 {
        font-size: 1.4rem;
        margin-bottom: 0.25rem;
      }
      .login-box p {
        color: var(--muted);
        font-size: 0.9rem;
        margin-bottom: 1.5rem;
      }
      #loginError,
      #cambioError {
        color: var(--color-error);
        font-size: 0.875rem;
        margin-top: 0.75rem;
        display: none;
      }
      /* Aviso del cambio obligatorio: explica POR QUÉ se le pide, que si no parece
         un trámite y la gente pone cualquier cosa. */
      .login-aviso {
        background: rgba(240, 160, 48, 0.12);
        border: 1px solid rgba(240, 160, 48, 0.35);
        border-radius: var(--radius-md);
        padding: 0.75rem 0.9rem;
        margin: 0 0 1.1rem;
        font-size: 0.86rem;
        line-height: 1.55;
      }
    </style>
  </head>
  <body>
    <div class="login-wrap">
      <div class="login-box">
        <div class="logo">
          <img src="assets/logos/Copia de Logo_proposta_DEL AMOR (1000 x 1000 px) (1920 x 1080 px).png" alt="Familia del Amor" />
        </div>
        <h1>Panel interno</h1>
        <p>Accede con tu usuario y contraseña.</p>
        <a href="/" style="display:block;text-align:center;margin-bottom:1rem;font-size:0.85rem;color:var(--muted);">← Volver al inicio</a>
        <form id="loginForm" class="form">
          <label>
            <span>Usuario</span>
            <input type="text" name="username" required autocomplete="username" />
          </label>
          <label>
            <span>Contraseña</span>
            <input type="password" name="password" required autocomplete="current-password" />
          </label>
          <button class="btn" type="submit">Entrar</button>
          <div id="loginError"></div>
        </form>

        <!-- Cambio obligatorio la primera vez. La cuenta se crea con la contraseña igual
             al usuario, así que hasta que se cambie no se puede hacer nada más. -->
        <form id="cambioForm" class="form hidden">
          <p class="login-aviso">Entras por primera vez. Elige una contraseña que solo sepas tú
            antes de seguir: la que traías es tu propio nombre de usuario y la sabe cualquiera.</p>
          <label>
            <span>Contraseña nueva</span>
            <input type="password" name="nueva" required autocomplete="new-password" minlength="6" />
          </label>
          <label>
            <span>Repítela</span>
            <input type="password" name="repite" required autocomplete="new-password" minlength="6" />
          </label>
          <button class="btn" type="submit">Guardar y entrar</button>
          <div id="cambioError"></div>
        </form>
      </div>
    </div>
    <script src="login.js"></script>
  </body>
</html>
