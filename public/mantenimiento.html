<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mantenimiento · Familia del Amor</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="panel">
    <header class="top">
      <div class="logo">
        <img src="assets/logos/Copia de Logo_proposta_DEL AMOR (1000 x 1000 px) (1920 x 1080 px).png" alt="Familia del Amor" />
      </div>
      <div class="user-bar">
        <span id="userBar"></span>
        <button class="btn ghost" id="logoutBtn">Salir</button>
      </div>
    </header>
    <main>
      <div class="panel-head">
        <span class="eyebrow">Panel interno</span>
        <h1>Mantenimiento</h1>
        <p>Incidencias y checklist por local.</p>
      </div>
      <section class="block">
        <div class="section-head">
          <h2>Nueva incidencia</h2>
          <p>Registra una avería o tarea de mantenimiento.</p>
        </div>
        <form id="issueForm" class="form">
          <label><span>Local</span>
            <select name="local" required>
              <option value="">Selecciona local</option>
              <option>La Tapeta - Blanes</option>
              <option>La Tapeta - Lloret</option>
              <option>La Tapeta - Girona</option>
              <option>Cooperativa - Blanes</option>
              <option>Can Mateu - Tordera</option>
              <option>La Tapa Ibérica - Tordera</option>
              <option>Botiga d'en Mateu - Tordera</option>
            </select>
          </label>
          <label><span>Título</span><input name="titulo" required /></label>
          <label><span>Descripción</span><textarea name="descripcion" rows="3" required></textarea></label>
          <button class="btn" type="submit">Crear incidencia</button>
        </form>
        <div class="card" id="issuesTable">Cargando incidencias...</div>
      </section>
    </main>
    <footer class="panel-footer">
      <div class="panel-footer-inner">
        <span>Familia del Amor · Panel interno</span>
        <a href="/">Ir al inicio →</a>
      </div>
    </footer>
    <script src="auth.js"></script>
    <script src="mantenimiento.js"></script>
  </body>
</html>
