<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 26" width="32" height="26" role="img" aria-hidden="true">
  <!-- Icono propio de cartera, NO el distintivo oficial de Apple.
       El distintivo «Add to Apple Wallet» es una imagen que Apple distribuye en sus
       Marketing Guidelines y no se puede redibujar: hay que descargarlo y sustituir este
       fichero por él (mismo nombre) antes de enseñar el botón a clientes. Mientras tanto,
       esto es un icono neutro acompañando un texto que dice lo mismo. -->
  <g fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round">
    <rect x="2" y="5" width="28" height="19" rx="4"/>
    <path d="M2 11h28"/>
  </g>
  <circle cx="24" cy="17.5" r="2" fill="#fff"/>
</svg>
